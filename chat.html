<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI接客チャット</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* API Key Setup Screen */
    #setup-screen {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    #setup-screen .icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    #setup-screen h2 {
      font-size: 1.4rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    #setup-screen p {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    #setup-screen input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
      font-family: monospace;
    }

    #setup-screen input:focus { border-color: #7c6fcd; }

    #setup-screen button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #setup-screen button:hover { opacity: 0.88; }

    #setup-screen .note {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #bbb;
    }

    /* Chat Screen */
    #chat-screen {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      height: 90vh;
      max-height: 720px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      padding: 18px 20px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .chat-header-info h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .chat-header-info p {
      font-size: 0.75rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    .settings-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .settings-btn:hover { background: rgba(255,255,255,0.15); }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .bot .bubble {
      background: #f2f1fb;
      color: #2d2d3e;
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-start;
    }

    .typing-bubble {
      background: #f2f1fb;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Result sections */
    .result-section {
      background: #f2f1fb;
      border-radius: 14px;
      padding: 14px 16px;
      max-width: 85%;
      align-self: flex-start;
      animation: fadeUp 0.3s ease;
    }

    .result-section .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #7c6fcd;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .result-section p {
      font-size: 0.88rem;
      color: #2d2d3e;
      line-height: 1.6;
    }

    .product-card {
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      border-radius: 14px;
      padding: 16px 18px;
      max-width: 85%;
      align-self: flex-start;
      color: #fff;
      animation: fadeUp 0.3s ease;
    }

    .product-card .card-label {
      font-size: 0.72rem;
      font-weight: 700;
      opacity: 0.8;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .product-card p {
      font-size: 0.88rem;
      line-height: 1.6;
    }

    /* Input area */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
      background: #fff;
    }

    #userInput {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e8e6f5;
      border-radius: 22px;
      font-size: 0.9rem;
      outline: none;
      resize: none;
      max-height: 80px;
      line-height: 1.4;
      font-family: inherit;
      transition: border-color 0.2s;
      background: #faf9fe;
    }

    #userInput:focus { border-color: #7c6fcd; background: #fff; }
    #userInput:disabled { background: #f5f5f5; color: #ccc; }

    #sendBtn {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #sendBtn:hover { opacity: 0.88; transform: scale(1.05); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #sendBtn svg { width: 18px; height: 18px; }

    /* Progress bar */
    .progress-bar {
      display: flex;
      gap: 5px;
      padding: 10px 16px 0;
      flex-shrink: 0;
    }

    .progress-dot {
      height: 4px;
      flex: 1;
      background: #e8e6f5;
      border-radius: 2px;
      transition: background 0.4s;
    }

    .progress-dot.active { background: linear-gradient(90deg, #7c6fcd, #9b8fe0); }

    /* Restart button */
    .restart-btn {
      margin: 8px auto 0;
      display: block;
      background: none;
      border: 2px solid #e8e6f5;
      color: #9b8fe0;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .restart-btn:hover { border-color: #9b8fe0; background: #faf9fe; }

    .error-msg {
      background: #fff0f0;
      border: 1px solid #ffccd0;
      color: #c0392b;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.82rem;
      max-width: 85%;
      align-self: flex-start;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<!-- API Key Setup Screen -->
<div id="setup-screen">
  <div class="icon">💬</div>
  <h2>AIスタッフとお話しします</h2>
  <p>Anthropic APIキーを入力してください。<br>キーはブラウザ内にのみ保存されます。</p>
  <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
  <button onclick="startChat()">はじめる</button>
  <p class="note">APIキーは <a href="https://console.anthropic.com/" target="_blank" style="color:#7c6fcd">console.anthropic.com</a> で取得できます</p>
</div>

<!-- Chat Screen -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="avatar">🌿</div>
    <div class="chat-header-info">
      <h3>AIスタッフ</h3>
      <p><span class="online-dot"></span>オンライン</p>
    </div>
    <button class="settings-btn" onclick="resetApiKey()">APIキー変更</button>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="progress-dot" id="p0"></div>
    <div class="progress-dot" id="p1"></div>
    <div class="progress-dot" id="p2"></div>
    <div class="progress-dot" id="p3"></div>
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <textarea id="userInput" placeholder="ここに入力してください..." rows="1" disabled></textarea>
    <button id="sendBtn" onclick="handleSend()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
  const QUESTIONS = [
    "今どんなときに一番気になりますか？",
    "どれくらいの頻度で感じますか？",
    "楽になる瞬間はありますか？",
    "どんな状態になったら嬉しいですか？"
  ];

  let apiKey = '';
  let currentQ = 0;
  let answers = [];
  let isWaiting = false;

  // ── Setup ──────────────────────────────────────────

  window.addEventListener('load', () => {
    const saved = localStorage.getItem('ai_chat_apikey');
    if (saved) {
      apiKey = saved;
      showChatScreen();
    }

    const inp = document.getElementById('apiKeyInput');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') startChat(); });
    document.getElementById('userInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
    autoResize();
  });

  function startChat() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (!val.startsWith('sk-')) {
      alert('正しいAPIキーを入力してください（sk-ant-... の形式）');
      return;
    }
    apiKey = val;
    localStorage.setItem('ai_chat_apikey', apiKey);
    showChatScreen();
  }

  function resetApiKey() {
    localStorage.removeItem('ai_chat_apikey');
    location.reload();
  }

  function showChatScreen() {
    document.getElementById('setup-screen').style.display = 'none';
    const cs = document.getElementById('chat-screen');
    cs.style.display = 'flex';
    setTimeout(() => {
      addBotMessage("こんにちは！お気軽に話しかけてください 😊");
      setTimeout(() => askQuestion(0), 900);
    }, 300);
  }

  // ── Chat Flow ──────────────────────────────────────

  function askQuestion(index) {
    updateProgress(index);
    setTimeout(() => {
      addBotMessage(QUESTIONS[index]);
      enableInput();
    }, 400);
  }

  function handleSend() {
    if (isWaiting) return;
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    resizeTextarea(input);
    disableInput();

    addUserMessage(text);
    answers.push(text);

    if (currentQ < QUESTIONS.length - 1) {
      currentQ++;
      showTyping();
      setTimeout(() => {
        removeTyping();
        askQuestion(currentQ);
      }, 900);
    } else {
      updateProgress(QUESTIONS.length);
      showTyping();
      generateResult();
    }
  }

  // ── Result Generation ──────────────────────────────

  async function generateResult() {
    isWaiting = true;

    const prompt = `
ユーザーが以下の4つの質問に回答しました。回答をもとに、複数の原因仮説を考慮しつつ、1つに決めつけずに寄り添う接客メッセージを作成してください。

【質問と回答】
Q1: 今どんなときに一番気になりますか？
A: ${answers[0]}

Q2: どれくらいの頻度で感じますか？
A: ${answers[1]}

Q3: 楽になる瞬間はありますか？
A: ${answers[2]}

Q4: どんな状態になったら嬉しいですか？
A: ${answers[3]}

【出力形式】
以下の4つのセクションをJSONで返してください。余計なテキストは不要です。

{
  "empathy": "共感のメッセージ（2〜3文。専門用語なし、短く温かく）",
  "image": "体感イメージ（どんなふうに楽になるか、具体的な日常シーンで1〜2文）",
  "explanation": "軽い説明（なぜそうなるかを優しく1〜2文。難しい言葉なし）",
  "proposal": "商品・アプローチの提案（押し売りせず、試してみたくなるよう1〜2文）"
}
`.trim();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-allow-browser': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 800,
          system: 'あなたは共感力の高いAI接客スタッフです。ユーザーの悩みに寄り添い、押し売りせず、試してみたいと思える提案をします。専門用語は使わず、やさしく短い文章で話します。',
          messages: [{ role: 'user', content: prompt }]
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const rawText = data.content[0].text.trim();

      let result;
      try {
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        result = JSON.parse(jsonMatch ? jsonMatch[0] : rawText);
      } catch {
        throw new Error('レスポンスの解析に失敗しました');
      }

      removeTyping();
      await showResult(result);

    } catch (err) {
      removeTyping();
      addErrorMessage(`エラーが発生しました: ${err.message}`);
      showRestartButton();
    }

    isWaiting = false;
  }

  async function showResult(result) {
    const sections = [
      { label: '気持ち、わかります', text: result.empathy, type: 'normal' },
      { label: 'こんなふうになれたら', text: result.image, type: 'normal' },
      { label: 'なぜそうなるの？', text: result.explanation, type: 'normal' },
      { label: 'おすすめしたいこと', text: result.proposal, type: 'product' }
    ];

    for (const s of sections) {
      await delay(600);
      addResultSection(s.label, s.text, s.type === 'product');
      scrollToBottom();
    }

    await delay(500);
    addBotMessage("ほかに気になることがあれば、いつでも聞かせてください。");
    showRestartButton();
  }

  // ── UI Helpers ─────────────────────────────────────

  function addBotMessage(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'message bot';
    el.innerHTML = `
      <div class="msg-avatar">🌿</div>
      <div class="bubble">${escHtml(text)}</div>
    `;
    msgs.appendChild(el);
    scrollToBottom();
  }

  function addUserMessage(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'message user';
    el.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
    msgs.appendChild(el);
    scrollToBottom();
  }

  function addResultSection(label, text, isProduct) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    if (isProduct) {
      el.className = 'product-card';
      el.innerHTML = `<div class="card-label">${escHtml(label)}</div><p>${escHtml(text)}</p>`;
    } else {
      el.className = 'result-section';
      el.innerHTML = `<div class="section-label">${escHtml(label)}</div><p>${escHtml(text)}</p>`;
    }
    msgs.appendChild(el);
  }

  function addErrorMessage(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'error-msg';
    el.textContent = text;
    msgs.appendChild(el);
    scrollToBottom();
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = 'typing';
    el.innerHTML = `
      <div class="msg-avatar">🌿</div>
      <div class="typing-bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    `;
    msgs.appendChild(el);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function showRestartButton() {
    const msgs = document.getElementById('messages');
    const btn = document.createElement('button');
    btn.className = 'restart-btn';
    btn.textContent = 'もう一度相談する';
    btn.onclick = restartChat;
    msgs.appendChild(btn);
    scrollToBottom();
  }

  function restartChat() {
    currentQ = 0;
    answers = [];
    isWaiting = false;
    document.getElementById('messages').innerHTML = '';
    updateProgress(-1);
    disableInput();
    setTimeout(() => {
      addBotMessage("また話しかけてくれてありがとうございます 😊");
      setTimeout(() => askQuestion(0), 900);
    }, 200);
  }

  function enableInput() {
    const inp = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    inp.disabled = false;
    btn.disabled = false;
    inp.focus();
  }

  function disableInput() {
    document.getElementById('userInput').disabled = true;
    document.getElementById('sendBtn').disabled = true;
  }

  function updateProgress(active) {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById(`p${i}`);
      dot.classList.toggle('active', i < active || active >= 4);
    }
  }

  function scrollToBottom() {
    const msgs = document.getElementById('messages');
    setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 50);
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/\n/g, '<br>');
  }

  // ── Auto-resize textarea ───────────────────────────

  function autoResize() {
    const ta = document.getElementById('userInput');
    ta.addEventListener('input', () => resizeTextarea(ta));
  }

  function resizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 80) + 'px';
  }
</script>
</body>
</html>
