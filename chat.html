<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI接客チャット</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Welcome Screen ── */
    #welcome-screen {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .welcome-icon { font-size: 3.2rem; margin-bottom: 16px; }

    #welcome-screen h2 {
      font-size: 1.4rem;
      color: #1a1a2e;
      margin-bottom: 10px;
    }

    #welcome-screen p {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }

    .badge {
      display: inline-block;
      background: #f0eeff;
      color: #7c6fcd;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    /* ── Chat Screen ── */
    #chat-screen {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      height: 90vh;
      max-height: 720px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      padding: 18px 20px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .header-info h3 { font-size: 1rem; font-weight: 600; }
    .header-info p  { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }

    .online-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    .restart-header-btn {
      margin-left: auto;
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 8px;
      font-family: inherit;
      transition: background 0.2s;
    }
    .restart-header-btn:hover { background: rgba(255,255,255,0.3); }

    /* progress */
    .progress-bar {
      display: flex;
      gap: 5px;
      padding: 10px 16px 0;
      flex-shrink: 0;
    }
    .progress-dot {
      height: 4px; flex: 1;
      background: #e8e6f5;
      border-radius: 2px;
      transition: background 0.4s;
    }
    .progress-dot.active { background: linear-gradient(90deg, #7c6fcd, #9b8fe0); }

    /* messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.bot  { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .bot  .bubble { background: #f2f1fb; color: #2d2d3e; border-bottom-left-radius: 4px; }
    .user .bubble { background: linear-gradient(135deg, #7c6fcd, #9b8fe0); color: #fff; border-bottom-right-radius: 4px; }

    /* typing */
    .typing-indicator {
      display: flex; align-items: flex-end; gap: 8px;
      align-self: flex-start;
    }
    .typing-bubble {
      background: #f2f1fb;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      background: #aaa; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    /* result cards */
    .result-section {
      background: #f2f1fb;
      border-radius: 14px;
      padding: 14px 16px;
      max-width: 85%;
      align-self: flex-start;
      animation: fadeUp 0.3s ease;
    }
    .result-section .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #7c6fcd;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .result-section p { font-size: 0.88rem; color: #2d2d3e; line-height: 1.6; }

    .product-card {
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      border-radius: 14px;
      padding: 16px 18px;
      max-width: 85%;
      align-self: flex-start;
      color: #fff;
      animation: fadeUp 0.3s ease;
    }
    .product-card .card-label {
      font-size: 0.72rem; font-weight: 700;
      opacity: 0.8; letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .product-card p { font-size: 0.88rem; line-height: 1.6; }

    /* input */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
      display: flex; gap: 8px; align-items: flex-end;
      flex-shrink: 0; background: #fff;
    }
    #userInput {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e8e6f5;
      border-radius: 22px;
      font-size: 0.9rem; outline: none;
      resize: none; max-height: 80px; line-height: 1.4;
      font-family: inherit;
      transition: border-color 0.2s; background: #faf9fe;
    }
    #userInput:focus   { border-color: #7c6fcd; background: #fff; }
    #userInput:disabled { background: #f5f5f5; color: #ccc; }

    #sendBtn {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #7c6fcd, #9b8fe0);
      border: none; border-radius: 50%;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.1s; flex-shrink: 0;
    }
    #sendBtn:hover    { opacity: 0.88; transform: scale(1.05); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #sendBtn svg { width: 18px; height: 18px; }

    .restart-btn {
      margin: 8px auto 0;
      display: block;
      background: none;
      border: 2px solid #e8e6f5;
      color: #9b8fe0; padding: 8px 20px;
      border-radius: 20px; font-size: 0.82rem;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .restart-btn:hover { border-color: #9b8fe0; background: #faf9fe; }
  </style>
</head>
<body>

<!-- Welcome Screen -->
<div id="welcome-screen">
  <div class="welcome-icon">🌿</div>
  <span class="badge">DEMO</span>
  <h2>AIスタッフにご相談ください</h2>
  <p>4つの質問にお答えいただくと、<br>あなたの状態に合わせたご提案をお伝えします。</p>
  <button class="btn-primary" onclick="showChatScreen()">はじめる（APIキー不要）</button>
</div>

<!-- Chat Screen -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="avatar">🌿</div>
    <div class="header-info">
      <h3>AIスタッフ</h3>
      <p><span class="online-dot"></span>オンライン</p>
    </div>
    <button class="restart-header-btn" onclick="restartChat()">もう一度</button>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="progress-dot" id="p0"></div>
    <div class="progress-dot" id="p1"></div>
    <div class="progress-dot" id="p2"></div>
    <div class="progress-dot" id="p3"></div>
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <textarea id="userInput" placeholder="ここに入力してください..." rows="1" disabled></textarea>
    <button id="sendBtn" onclick="handleSend()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
  // ── Questions ────────────────────────────────────────────
  const QUESTIONS = [
    "今どんなときに一番気になりますか？",
    "どれくらいの頻度で感じますか？",
    "楽になる瞬間はありますか？",
    "どんな状態になったら嬉しいですか？"
  ];

  // ── Demo Response Templates ──────────────────────────────
  // Keyword-based matching: each entry has keywords[] to detect context,
  // and a response object with the 4 sections.

  const RESPONSE_TEMPLATES = [
    {
      keywords: ['仕事', '職場', '会議', 'パソコン', 'デスク', '残業', '締め切り', 'ストレス', '上司', '同僚'],
      empathy:  "仕事のことが頭から離れない時間って、本当につらいですよね。「ちゃんとやらなきゃ」という気持ちが、知らず知らず体に積み重なっているのかもしれません。",
      image:    "夜、布団に入ったときにスーッと肩の力が抜けて、「今日はもう終わり」と思えるような感覚。そんな夜を取り戻せたら、どれだけ楽だろうと思います。",
      explanation: "緊張が続くと、体が「オフ」になるタイミングを見失ってしまうことがあります。休もうとしても休めないのは、意志の問題じゃなくて体のクセなんです。",
      proposal: "まず5分だけ、画面から離れてゆっくり呼吸するだけで、体の切り替えスイッチが入りやすくなります。小さなことから試してみませんか？"
    },
    {
      keywords: ['眠れ', '睡眠', '夜', '朝', '疲れ', '目が覚め', '寝付け', '起きられ', '夢'],
      empathy:  "眠りに関する悩みって、毎日のことだから本当に消耗しますよね。「なんで眠れないんだろう」と思うだけでさらに眠れなくなる、あの感じはつらいです。",
      image:    "朝目覚めたとき、「あ、よく眠れた」とすっきり感じられる朝。体が軽くて、一日が前向きに始められる、そんなイメージです。",
      explanation: "眠りが浅いのは、体がまだ「戦闘モード」のままのことが多いです。脳と体が夜モードに切り替わるタイミングを、少しサポートしてあげると変わってきます。",
      proposal: "寝る前の1時間、スマホの光を少し落とすだけでも体は反応します。もし習慣にしにくければ、もう少し手軽なサポート方法もありますよ。"
    },
    {
      keywords: ['頭痛', '肩こり', '腰', '体', '痛', '重', 'だるい', '首', '背中', 'こり'],
      empathy:  "体の重さや痛みって、我慢しているうちに「これが普通」になってしまいがちですよね。でも本当はずっとしんどかったんだと思います。",
      image:    "朝起きたとき、体がふわっと軽くて、動き出すのが苦じゃない感覚。一日の最初から気持ちが上向きになる、そんな毎日に近づけるといいですよね。",
      explanation: "体の一部に力が入り続けると、血のめぐりが悪くなって重さや痛みを感じやすくなります。特定の姿勢や動きのクセが影響していることも多いです。",
      proposal: "まずは「いつ一番つらいか」を観察するだけでも、体のパターンが見えてきます。小さな変化から始めてみませんか？"
    },
    {
      keywords: ['不安', '心配', 'ドキドキ', '緊張', '怖', 'モヤ', '気分', 'イライラ', '落ち込', '気持ち'],
      empathy:  "そういう感覚って、言葉にしにくいけどずっと心のどこかに引っかかっていますよね。一人で抱えていたこと、少し話せてよかったです。",
      image:    "なんとなくモヤっとした感じがなくて、今日一日を「まあいっか」と軽やかに過ごせる。そんな気持ちの余白が生まれたらいいですよね。",
      explanation: "心がざわざわするのは、脳が「気をつけなきゃ」とアラートを出し続けているサインのことがあります。悪いことではなく、ただ少し敏感になっているだけです。",
      proposal: "気持ちをそのまま書き出すだけで、頭の中が整理されることがあります。まずは紙でもスマホのメモでも、試してみる価値はあると思いますよ。"
    },
    {
      keywords: ['食事', '食べ', '胃', '腸', 'お腹', '消化', '便', '体重', 'むくみ', '肌'],
      empathy:  "体の内側からの不調って、外からは見えないぶん「気のせいかな」と思いながら我慢してしまいますよね。でも毎日感じているなら、ちゃんとサインだと思います。",
      image:    "食後にお腹が楽で、夕方になってもむくみや重さを感じない一日。体の内側が整ってくると、気持ちまで明るくなってくるものです。",
      explanation: "腸と体の調子はつながっています。食べたものや食べ方の小さなクセが、じわじわ影響していることもよくあります。",
      proposal: "まず水分をこまめに摂るだけでも、体の流れが変わることがあります。もっと体の内側から整えたいと思ったら、一緒に考えましょう。"
    }
  ];

  // Fallback template (no keyword match)
  const FALLBACK_TEMPLATE = {
    empathy:  "話してくださってありがとうございます。毎日の中でそういうことが続いていたんですね。一人で抱えてきた分、本当につらかったと思います。",
    image:    "ふと気づいたら「最近調子いいな」と感じる瞬間が増えていく、そんな日々に近づけたらいいですよね。",
    explanation: "体や気持ちの不調は、一つの原因ではなくいくつかのことが重なっていることがほとんどです。だから「これだ」と決めつけず、丁寧に向き合うことが大切です。",
    proposal: "まず今感じていることを、もう少し細かく観察してみるだけでも変わってきます。一緒に、少しずつ整えていきましょう。"
  };

  // ── State ────────────────────────────────────────────────
  let currentQ = 0;
  let answers  = [];
  let isWaiting = false;

  // ── Init ─────────────────────────────────────────────────
  window.addEventListener('load', () => {
    document.getElementById('userInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });
    document.getElementById('userInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 80) + 'px';
    });
  });

  function showChatScreen() {
    document.getElementById('welcome-screen').style.display = 'none';
    const cs = document.getElementById('chat-screen');
    cs.style.display = 'flex';
    setTimeout(() => {
      addBotMessage("こんにちは！どうぞお気軽にお話しください 😊");
      setTimeout(() => askQuestion(0), 900);
    }, 300);
  }

  // ── Chat Flow ────────────────────────────────────────────
  function askQuestion(index) {
    updateProgress(index);
    setTimeout(() => {
      addBotMessage(QUESTIONS[index]);
      enableInput();
    }, 400);
  }

  function handleSend() {
    if (isWaiting) return;
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    disableInput();
    addUserMessage(text);
    answers.push(text);

    if (currentQ < QUESTIONS.length - 1) {
      currentQ++;
      showTyping();
      setTimeout(() => {
        removeTyping();
        askQuestion(currentQ);
      }, 900);
    } else {
      updateProgress(QUESTIONS.length);
      isWaiting = true;
      showTyping();
      setTimeout(() => {
        removeTyping();
        const result = buildDemoResult(answers);
        showResult(result);
      }, 1800);
    }
  }

  // ── Demo AI Logic ────────────────────────────────────────
  function buildDemoResult(answers) {
    const combined = answers.join(' ');

    // Score each template by keyword matches
    let best = null;
    let bestScore = 0;

    for (const tpl of RESPONSE_TEMPLATES) {
      const score = tpl.keywords.filter(kw => combined.includes(kw)).length;
      if (score > bestScore) {
        bestScore = score;
        best = tpl;
      }
    }

    // Use fallback if no good match
    const source = (best && bestScore > 0) ? best : FALLBACK_TEMPLATE;

    // Personalise the empathy line with Q4 answer (desired state)
    const desiredState = answers[3] || '';
    let empathy = source.empathy;
    if (desiredState && desiredState.length < 30) {
      empathy += `\n「${desiredState}」という気持ち、すごく大切だと思います。`;
    }

    return {
      empathy:     empathy,
      image:       source.image,
      explanation: source.explanation,
      proposal:    source.proposal
    };
  }

  async function showResult(result) {
    const sections = [
      { label: '気持ち、わかります',   text: result.empathy,     product: false },
      { label: 'こんなふうになれたら', text: result.image,       product: false },
      { label: 'なぜそうなるの？',     text: result.explanation, product: false },
      { label: 'おすすめしたいこと',   text: result.proposal,    product: true  }
    ];

    for (const s of sections) {
      await delay(700);
      addResultSection(s.label, s.text, s.product);
      scrollToBottom();
    }

    await delay(600);
    addBotMessage("ほかに気になることがあれば、いつでも聞かせてください。");
    showRestartButton();
    isWaiting = false;
  }

  // ── UI Helpers ───────────────────────────────────────────
  function addBotMessage(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'message bot';
    el.innerHTML = `<div class="msg-avatar">🌿</div><div class="bubble">${escHtml(text)}</div>`;
    msgs.appendChild(el);
    scrollToBottom();
  }

  function addUserMessage(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'message user';
    el.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
    msgs.appendChild(el);
    scrollToBottom();
  }

  function addResultSection(label, text, isProduct) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    if (isProduct) {
      el.className = 'product-card';
      el.innerHTML = `<div class="card-label">${escHtml(label)}</div><p>${escHtml(text)}</p>`;
    } else {
      el.className = 'result-section';
      el.innerHTML = `<div class="section-label">${escHtml(label)}</div><p>${escHtml(text)}</p>`;
    }
    msgs.appendChild(el);
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = 'typing';
    el.innerHTML = `
      <div class="msg-avatar">🌿</div>
      <div class="typing-bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>`;
    msgs.appendChild(el);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function showRestartButton() {
    const msgs = document.getElementById('messages');
    const btn = document.createElement('button');
    btn.className = 'restart-btn';
    btn.textContent = 'もう一度相談する';
    btn.onclick = restartChat;
    msgs.appendChild(btn);
    scrollToBottom();
  }

  function restartChat() {
    currentQ = 0; answers = []; isWaiting = false;
    document.getElementById('messages').innerHTML = '';
    updateProgress(-1);
    disableInput();
    setTimeout(() => {
      addBotMessage("また来てくださってありがとうございます 😊");
      setTimeout(() => askQuestion(0), 900);
    }, 200);
  }

  function enableInput() {
    const inp = document.getElementById('userInput');
    inp.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    inp.focus();
  }

  function disableInput() {
    document.getElementById('userInput').disabled = true;
    document.getElementById('sendBtn').disabled = true;
  }

  function updateProgress(active) {
    for (let i = 0; i < 4; i++) {
      document.getElementById(`p${i}`).classList.toggle('active', i < active || active >= 4);
    }
  }

  function scrollToBottom() {
    const msgs = document.getElementById('messages');
    setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 50);
  }

  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
  }
</script>
</body>
