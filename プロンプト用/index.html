<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ヒアリング">
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Claude ヒアリング</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161820;
    --border: #252830;
    --accent: #5b8df5;
    --accent2: #a78bfa;
    --green: #34d399;
    --yellow: #fbbf24;
    --text: #e8eaf0;
    --muted: #6b7280;
    --user-bg: #1e2a45;
    --claude-bg: #1a1c24;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(14px + var(--safe-top)) 20px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 12px;
  }

  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .top-bar-title {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    min-width: 32px;
    text-align: right;
  }

  .progress-bar {
    width: 80px; height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Chat scroll area */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 0;
    -webkit-overflow-scrolling: touch;
  }

  .msg {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .msg.visible { opacity: 1; transform: none; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg-claude .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .msg-user .avatar {
    background: var(--user-bg);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 10px;
    font-family: 'Space Mono', monospace;
  }

  .msg-claude { flex-direction: row; }
  .msg-user { flex-direction: row-reverse; }

  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.85;
  }

  .msg-claude .bubble {
    background: var(--claude-bg);
    border: 1px solid var(--border);
    border-top-left-radius: 0;
  }

  .msg-user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(91,141,245,0.2);
    border-top-right-radius: 0;
    color: #c8d8ff;
  }

  .bubble strong { color: var(--accent); font-weight: 500; }

  .typing {
    display: flex; gap: 4px; padding: 4px 0;
  }
  .typing span {
    width: 5px; height: 5px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,80%,100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Choices — fixed at bottom */
  .choices-area {
    flex-shrink: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    gap: 7px;
    transition: opacity 0.3s ease;
  }

  .choices-area.hidden { display: none; }

  .choice-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 16px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    border-radius: 6px;
    transition: all 0.18s ease;
    line-height: 1.5;
    width: 100%;
    -webkit-appearance: none;
  }

  .choice-btn:active { transform: scale(0.98); }

  .choice-btn.selected {
    border-color: var(--accent);
    background: rgba(91,141,245,0.12);
    color: var(--accent);
  }

  .choice-btn:disabled { opacity: 0.35; }

  /* Result */
  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    padding: 20px;
    margin: 4px 0 0 38px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    border-radius: 4px;
  }
  .result-box.visible { opacity: 1; transform: none; }

  .result-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--green);
    letter-spacing: 0.18em;
    margin-bottom: 14px;
  }

  .result-prompt {
    background: #0a0c10;
    border: 1px solid var(--border);
    padding: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    line-height: 2;
    color: #c8d8ff;
    white-space: pre-wrap;
    word-break: break-all;
    border-radius: 3px;
  }

  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .copy-btn {
    flex: 1;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: 4px;
    -webkit-appearance: none;
  }
  .copy-btn:active { background: var(--accent); color: #fff; }

  .restart-btn {
    flex: 1;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: 4px;
    -webkit-appearance: none;
  }
  .restart-btn:active { border-color: var(--text); color: var(--text); }

  .tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 2px;
    margin: 0 2px;
    vertical-align: middle;
  }
  .tag-blue { background: rgba(91,141,245,0.15); color: var(--accent); }
  .tag-green { background: rgba(52,211,153,0.12); color: var(--green); }

  /* Install banner */
  .install-banner {
    display: none;
    background: rgba(91,141,245,0.1);
    border: 1px solid rgba(91,141,245,0.3);
    padding: 10px 16px;
    margin: 0 16px 8px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--accent);
    align-items: center;
    gap: 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .install-banner.show { display: flex; }
  .install-banner span { flex: 1; }
  .install-close { color: var(--muted); font-size: 16px; padding: 0 4px; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <div class="app-icon">✦</div>
    <span class="top-bar-title">CLAUDE HEARING</span>
  </div>
  <div class="progress-wrap">
    <span class="progress-label" id="prog-label">0 / 5</span>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  </div>
</div>

<div class="install-banner" id="install-banner">
  <span>📲 ホーム画面に追加できます</span>
  <button onclick="installApp()" style="background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:11px;cursor:pointer;">追加</button>
  <span class="install-close" onclick="document.getElementById('install-banner').classList.remove('show')">✕</span>
</div>

<div class="chat" id="chat"></div>

<div class="choices-area hidden" id="choices-area"></div>

<script>
// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('install-banner').classList.remove('show');
    });
  }
}

// App
const chat = document.getElementById('chat');
const choicesArea = document.getElementById('choices-area');
const progFill = document.getElementById('prog-fill');
const progLabel = document.getElementById('prog-label');
const TOTAL = 5;
const answers = {};

function updateProgress(n) {
  progFill.style.width = (n / TOTAL * 100) + '%';
  progLabel.textContent = n + ' / ' + TOTAL;
}

function scrollBottom() {
  setTimeout(() => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }), 80);
}

function show(el) {
  requestAnimationFrame(() => setTimeout(() => el.classList.add('visible'), 30));
}

function addMsg(role, html, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const wrap = document.createElement('div');
      wrap.className = 'msg msg-' + role;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'claude' ? '✦' : 'あ';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (role === 'claude') {
        const t = document.createElement('div');
        t.className = 'typing';
        t.innerHTML = '<span></span><span></span><span></span>';
        bubble.appendChild(t);
        wrap.appendChild(avatar); wrap.appendChild(bubble);
        chat.appendChild(wrap); show(wrap); scrollBottom();
        setTimeout(() => { bubble.innerHTML = html; scrollBottom(); resolve(); }, 700);
      } else {
        bubble.innerHTML = html;
        wrap.appendChild(avatar); wrap.appendChild(bubble);
        chat.appendChild(wrap); show(wrap); scrollBottom(); resolve();
      }
    }, delay);
  });
}

function showChoices(options) {
  return new Promise(resolve => {
    choicesArea.innerHTML = '';
    choicesArea.classList.remove('hidden');

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = opt.label;
      btn.onclick = () => {
        choicesArea.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true; b.classList.remove('selected');
        });
        btn.classList.add('selected');
        setTimeout(() => {
          choicesArea.classList.add('hidden');
          resolve(opt);
        }, 180);
      };
      choicesArea.appendChild(btn);
    });
    scrollBottom();
  });
}

function buildPrompt() {
  const catMap = { writing:'文章の作成・編集', research:'調査・まとめ・分析', code:'コーディング・技術サポート', idea:'アイデア出し', consult:'相談・意思決定サポート' };
  const audMap = { self:'自分だけが使う個人用', internal:'社内のチーム向け', formal:'上司・クライアントへの提出物', public:'一般公開・SNS・Web向け' };
  const toneMap = { formal:'丁寧・フォーマルな敬語', casual:'カジュアルでフレンドリー', concise:'簡潔な箇条書き中心', logical:'論理的・データドリブン', emotional:'共感・感情に訴えるスタイル' };
  const depthMap = { short:'300字以内でコンパクトに', medium:'A4 1枚程度の標準量で', long:'可能な限り詳細・網羅的に', iterative:'まず概要、詳細は必要に応じて' };
  const conMap = { speed:'スピード優先・すぐ使える形で', accuracy:'正確さ重視・不確かな情報は明示して', creative:'独創的・ユニークな切り口で', template:'既存フォーマットに沿って', none:'特に制約なし' };

  return `◯◯をつくって。
まず私にヒアリングして。一問ずつ聞いて、
答えを確認しながら進めて。
聞くべき項目は以下を軸に5問以内で。
ヒアリングが終わったら内容を
箇条書きで確認してから作業を始めて。

# 目的・ゴール
${catMap[answers.category] || ''}

# 対象・用途
${audMap[answers.audience] || ''}

# トーン・スタイル
${toneMap[answers.tone] || ''}

# ボリューム
${depthMap[answers.depth] || ''}

# 優先したいこと
${conMap[answers.constraint] || ''}`;
}

async function run() {
  updateProgress(0);
  choicesArea.classList.add('hidden');

  await addMsg('claude', 'こんにちは！<br>5問に答えるだけで<strong>最適なプロンプト</strong>が生成されます。<span class="tag tag-blue">約1分</span>', 0);
  await addMsg('claude', 'まず、今回お願いしたいのはどのカテゴリ？', 500);

  const q1 = await showChoices([
    { label: '📝 文章を書く・編集する', val: 'writing' },
    { label: '🔍 調べる・まとめる・分析する', val: 'research' },
    { label: '💻 コード・技術的な作業', val: 'code' },
    { label: '💡 アイデア出し・ブレスト', val: 'idea' },
    { label: '🗣️ 相談・意思決定のサポート', val: 'consult' },
  ]);
  answers.category = q1.val;
  await addMsg('user', q1.label);
  updateProgress(1);

  await addMsg('claude', '誰のために使いますか？', 400);
  const q2 = await showChoices([
    { label: '👤 自分だけ（個人用・メモ）', val: 'self' },
    { label: '👥 社内の同僚・チームに共有', val: 'internal' },
    { label: '🏢 上司・クライアントに提出', val: 'formal' },
    { label: '🌐 外部・一般公開（SNS・Webなど）', val: 'public' },
  ]);
  answers.audience = q2.val;
  await addMsg('user', q2.label);
  updateProgress(2);

  await addMsg('claude', 'どんなトーン・スタイルを求めていますか？', 400);
  const q3 = await showChoices([
    { label: '📚 丁寧・フォーマル（敬語）', val: 'formal' },
    { label: '💬 カジュアル・フレンドリー', val: 'casual' },
    { label: '🎯 簡潔・箇条書き中心', val: 'concise' },
    { label: '🔬 論理的・データ重視', val: 'logical' },
    { label: '✨ 感情的・共感重視', val: 'emotional' },
  ]);
  answers.tone = q3.val;
  await addMsg('user', q3.label);
  updateProgress(3);

  await addMsg('claude', 'どのくらいの量・詳しさで？', 400);
  const q4 = await showChoices([
    { label: '🎯 要点だけ（300字以内）', val: 'short' },
    { label: '📄 標準的な量（A4 1枚程度）', val: 'medium' },
    { label: '📖 詳細・網羅的に', val: 'long' },
    { label: '🔄 概要→必要なら深掘り', val: 'iterative' },
  ]);
  answers.depth = q4.val;
  await addMsg('user', q4.label);
  updateProgress(4);

  await addMsg('claude', '最後！一番大事にしたいことは？', 400);
  const q5 = await showChoices([
    { label: '⏰ スピード重視・すぐ使える形で', val: 'speed' },
    { label: '✅ 正確さ・ファクト最優先', val: 'accuracy' },
    { label: '🎨 独創性・オリジナリティ', val: 'creative' },
    { label: '📋 既存フォーマットに沿って', val: 'template' },
    { label: '❓ おまかせ', val: 'none' },
  ]);
  answers.constraint = q5.val;
  await addMsg('user', q5.label);
  updateProgress(5);

  await addMsg('claude', '<span class="tag tag-green">✓ 完了</span>　プロンプトを生成しました！', 400);

  setTimeout(() => {
    const box = document.createElement('div');
    box.className = 'result-box';

    const label = document.createElement('div');
    label.className = 'result-label';
    label.textContent = '▶ GENERATED PROMPT';

    const pre = document.createElement('div');
    pre.className = 'result-prompt';
    pre.textContent = buildPrompt();

    const row = document.createElement('div');
    row.className = 'action-row';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'COPY';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(pre.textContent).then(() => {
        copyBtn.textContent = '✓ COPIED';
        setTimeout(() => copyBtn.textContent = 'COPY', 2000);
      });
    };

    const restartBtn = document.createElement('button');
    restartBtn.className = 'restart-btn';
    restartBtn.textContent = 'RESTART';
    restartBtn.onclick = () => {
      chat.innerHTML = '';
      Object.keys(answers).forEach(k => delete answers[k]);
      run();
    };

    row.appendChild(copyBtn);
    row.appendChild(restartBtn);
    box.appendChild(label);
    box.appendChild(pre);
    box.appendChild(row);
    chat.appendChild(box);
    setTimeout(() => { box.classList.add('visible'); scrollBottom(); }, 100);
  }, 800);
}

run();
</script>
</body>
</html>
