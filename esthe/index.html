:block;width:100%;text-align:left;margin:8px 0;font-size:15px}.branch-panel button.active{background:var(--soft);border-color:var(--blue);color:var(--blue);box-shadow:inset 3px 0 var(--blue)}.branch-panel .group{font-size:12px;color:var(--muted);letter-spacing:1px;margin:20px 0 10px}.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}.steps button{font-size:14px;background:white;padding:8px 13px}.steps .active{color:white;background:var(--navy);border-color:var(--navy)}.contact{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:23px}.contact h1{font-size:25px}.phone{font-size:24px;font-weight:600;white-space:nowrap}.record{padding:25px 30px;margin-top:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:14px;font-weight:500}label input,label select,label textarea{display:block;width:100%;margin-top:7px;font-weight:400}textarea{resize:vertical;min-height:85px;line-height:1.6}.wide{grid-column:1/-1}.record-head{display:flex;justify-content:space-between;gap:10px}.savebar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}details{margin-top:22px}summary{cursor:pointer;font-size:15px;padding:10px 0}details .formgrid{padding-top:15px}.history-item{border-bottom:1px solid var(--line);padding:15px 0;font-size:14px;line-height:1.7;white-space:pre-wrap}.empty{padding:45px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:14px 24px;border-radius:9px;box-shadow:0 8px 30px #122a4b30;z-index:100;max-width:90vw;font-size:14px}.setup{max-width:900px}.setup li{margin:18px 0;line-height:1.9}.codebox{width:100%;height:230px;font-family:monospace;font-size:13px;white-space:pre}.buttonrow{display:flex;gap:10px;flex-wrap:wrap}.sectiontitle{display:flex;align-items:center;gap:10px}.tiny{font-size:12px}.hidden{display:none!important}@media(min-width:1500px){.script-text{font-size:24px}}@media(max-width:900px){.wrap{padding:22px 18px}.split{grid-template-columns:minmax(0,1fr) 235px;gap:14px}.script{padding:24px}.script-text{font-size:20px}.record{padding:22px}.contact{display:block}.phone{display:block;margin-top:12px}.stats{gap:8px}.stat{padding:14px}.banner{padding:10px 18px}header{padding:0 18px}}@media(max-width:650px){header{height:auto;min-height:76px;padding:14px;flex-wrap:wrap}.brand b{font-size:17px}.wrap{padding:20px 14px}.stats{grid-template-columns:repeat(2,1fr)}.split{display:flex;flex-direction:column}.split>div{width:100%}.aside{position:static;order:-1}.branch-panel{padding:12px}.branch-panel h3{margin-bottom:8px}.branch-panel .group{margin:8px 0}.branch-panel .buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.branch-panel button{margin:0;font-size:14px;padding:8px 10px}.script{padding:22px}.script-text{font-size:20px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.topline{align-items:flex-start}.topline h1{font-size:24px}.savebar{flex-wrap:wrap}.banner{align-items:flex-start}.contact h1{font-size:22px}.steps button{font-size:13px}.record{padding:20px}.filters{padding:14px}td,th{padding:14px}.phone{font-size:22px}}

<script src="./config.js"></script><script src="./api.js"></script><script src="https://accounts.google.com/gsi/client" async onload="window.dispatchEvent(new Event('gis-ready'))"></script><script>
const SEED=null;
const LIVE=true;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['未架電','アポ獲得','再電話','不在','資料送付','見送り','連絡不要','訪問済'];
const fields=[['first','最初の反応'],['beauty','美容商品の意見を聞きたい、への反応'],['jewelry','プラチナジュエリーへの反応'],['scope','マイクロスコープへの反応'],['price','価格を聞かれたか'],['reason','断られた理由'],['words','相手が使った言葉'],['good','反応が良かった言葉'],['bad','反応が悪かった言葉']];
const headings=['① 最初の入り方','② 用件を短く伝える','③ 「ちょっと見てみたい」を作る','④ アポを取る','「どんな商品ですか？」と聞かれたら','「いくらですか？」と聞かれたら','「営業ですよね？」と言われたら','「うちはそういう商品は扱いません」','「興味ないです」','「忙しいです」','「資料を送ってください」','アポが取れたら'];
const titles=['最初の入り方','用件を短く伝える','体験への興味をつくる','日程を相談する','どんな商品？','いくらですか？','営業ですよね？','商品は扱わない','興味がない','今は忙しい','資料を送って','アポが取れた'];
let returnStep=0,branchTrail=[];
let listSheet='リスト_山梨',scriptSheet='スクリプト';
let data=null,selected=null,step=0,path=[],view='list',saving=false,pending=null,filter={q:'',region:'',status:''};
let key='esthe-pages-unauthed';
const draftKey=()=>listSheet+'::'+selected.No;
function readLocal(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}let drafts={};
function dateNow(){return new Date(Date.now()+9*3600000).toISOString().slice(0,16)}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function rpc(name,arg){return EstheAPI.call(name,arg)}
function parseList(rows){const head=rows[0];return rows.slice(1).filter(r=>r[head.indexOf('店名')]).map(r=>Object.fromEntries(head.map((h,i)=>[h,String(r[i]??'')])))}
function scripts(rows){const lines=rows.map(r=>String(r[1]??'').trim());return headings.map((h,i)=>{const start=lines.indexOf(h);if(start<0)return ['この見出しがスプシ内に見つかりません。元のスクリプトをご確認ください。'];const ends=[...headings.slice(i+1),'最初の5件で記録すること'].map(t=>lines.indexOf(t,start+1)).filter(n=>n>start);return lines.slice(start+1,ends.length?Math.min(...ends):lines.length).filter(Boolean)})}
function setBanner(){$('#banner').className='banner live';$('#banner').textContent='Google スプレッドシート接続中 · 記録は「保存」で反映されます。';$('#setupBtn').classList.remove('hidden')}
async function load(){setBanner();$('#app').innerHTML='<div class="empty">店舗リストを読み込んでいます…</div>';try{data=LIVE?await rpc('getData',{listSheet}):{list:parseList(SEED.list),scripts:SEED.scripts,scriptSets:{'スクリプト':SEED.scripts},listSheets:['リスト_山梨'],history:[]};if(!data.scriptSets[scriptSheet])scriptSheet=Object.keys(data.scriptSets)[0];data.scripts=data.scriptSets[scriptSheet];showList()}catch(e){$('#app').innerHTML='<div class="panel empty">読み込みに失敗しました。<p>'+esc(e.message)+'</p><button onclick="load()">再読み込み</button></div>'}}
function badge(s){return '<span class="badge '+(s==='アポ獲得'||s==='訪問済'?'good':s==='再電話'?'warn':'')+'">'+esc(s||'未架電')+'</span>'}
function showList(){if(saving)return;view='list';selected=null;const done=data.list.filter(r=>r['TEL日']).length,ap=data.list.filter(r=>r['進捗']==='アポ獲得').length;$('#app').className='wrap';$('#app').innerHTML=`<div class="topline"><div><h1>店舗リスト</h1><span class="muted">県別リストとスクリプトを選んで、電話をはじめる。</span></div><button onclick="load()">${LIVE?'スプシから更新':'リストを再表示'}</button></div><div class="stats"><div class="stat"><span>対象店舗</span><b>${data.list.length}<small class="muted"> 件</small></b></div><div class="stat"><span>架電済み店舗</span><b>${done}<small class="muted"> 件</small></b></div><div class="stat"><span>アポ獲得</span><b>${ap}<small class="muted"> 件</small></b></div><div class="stat accent"><span>5件ごとの振り返り</span><b>${versionRecords(data.history,scriptSheet).length%5} <small style="font-size:16px;font-weight:400">/ 5件</small></b><span>選択中のスクリプト ${versionRecords(data.history,scriptSheet).length} 件</span></div></div><section class="panel"><div class="filters"><label>県別リスト<select id="listSheet">${data.listSheets.map(n=>`<option value="${esc(n)}" ${n===listSheet?'selected':''}>${esc(n==='リスト'?'山梨（リスト）':n.replace(/^リスト_/,''))}</option>`).join('')}</select></label><label>使用スクリプト<select id="scriptSheet">${Object.keys(data.scriptSets).map(n=>`<option ${n===scriptSheet?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div><div class="filters"><input type="search" id="search" aria-label="店舗名・地域を検索" placeholder="店舗名・地域で検索" value="${esc(filter.q)}"><select id="region" aria-label="地域"><option value="">すべての地域</option>${[...new Set(data.list.map(r=>r['地域']))].map(r=>`<option ${r===filter.region?'selected':''}>${esc(r)}</option>`).join('')}</select><select id="statusFilter" aria-label="進捗"><option value="">すべての進捗</option>${statuses.map(r=>`<option ${r===filter.status?'selected':''}>${r}</option>`).join('')}</select></div><div class="table-scroll"><table><thead><tr><th>No.</th><th>店舗名 / 地域</th><th>電話番号</th><th>進捗</th><th>TEL日</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel" style="padding:22px;margin-top:22px"><h2>5件ごとの検証</h2><p class="muted">同じ県別リスト・同じスクリプトの記録を、保存順に5件ずつ比較します。</p><button class="primary" onclick="showReview()">振り返りを開く</button></section>`;['search','region','statusFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',()=>{filter={q:$('#search').value,region:$('#region').value,status:$('#statusFilter').value};renderRows()}));$('#listSheet').onchange=()=>{listSheet=$('#listSheet').value;filter={q:'',region:'',status:''};load()};$('#scriptSheet').onchange=()=>{scriptSheet=$('#scriptSheet').value;data.scripts=data.scriptSets[scriptSheet];showList()};renderRows()}
function renderRows(){const rows=data.list.filter(r=>(r['店名']+' '+r['地域']).toLowerCase().includes(filter.q.toLowerCase())&&(!filter.region||r['地域']===filter.region)&&(!filter.status||(r['進捗']||'未架電')===filter.status));$('#rows').innerHTML=rows.length?rows.map(r=>`<tr><td class="muted">${esc(r.No.padStart(2,'0'))}</td><td class="name">${esc(r['店名'])}<div class="muted" style="margin-top:6px;font-weight:400">${esc(r['地域'])}${drafts[listSheet+'::'+r.No]?' · 下書きあり':''}</div></td><td>${esc(r['電話'])}</td><td>${badge(r['進捗'])}</td><td>${esc(r['TEL日']||'—')}</td><td><button class="primary" data-id="${esc(r.No)}">スクリプトを開く</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">該当する店舗はありません。</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openContact(b.dataset.id))}
function historyHtml(h){return `<div class="history-item"><b>${esc(h.name||'')}</b>　${esc(h.date||'')}　${badge(h.status)}${h.appointment?'\n訪問予定：'+esc(h.appointment):''}${h.operator?'\n担当：'+esc(h.operator):''}${h.words?'\n相手の言葉：'+esc(h.words):''}${h.note?'\nメモ：'+esc(h.note):''}</div>`}
function openContact(id){selected=data.list.find(r=>r.No===id);if(!selected)return;view='call';step=0;returnStep=0;branchTrail=[];path=[titles[0]];pending=null;const f=drafts[listSheet+'::'+id]||{};$('#app').className='wrap';$('#app').innerHTML=`<button class="ghost" onclick="showList()" style="margin-bottom:20px">← 店舗リスト</button><div class="contact"><div><h1>${esc(selected['店名'])}</h1><span class="muted">${esc(listSheet==='リスト'?'山梨':listSheet.replace(/^リスト_/,''))} · ${esc(selected['地域'])} · ${esc(selected['住所'])}</span><div class="muted" style="margin-top:8px">${esc(selected['店舗有無・形態'])}　${badge(selected['進捗'])}</div></div><div>${/^[\d-]+$/.test(selected['電話'])?`<a class="phone" href="tel:${esc(selected['電話'])}">${esc(selected['電話'])}</a>`:'<span class="muted">電話番号の記載なし</span>'}</div></div><div class="split"><div><nav id="steps" class="steps" aria-label="基本の流れ"></nav><section class="panel script" id="script" aria-live="polite"></section><section class="panel record"><div class="record-head"><h2>電話の記録</h2><span class="muted" id="draftStatus">${f.date?'下書きを復元しました':'未保存'}</span></div><form id="recordForm">${evaluationForm(f)}<div class="formgrid"><label>担当者名<input name="operator" maxlength="80" value="${esc(f.operator||'')}" placeholder="例：佐野"></label><label>電話日時（日本時間）<input required type="datetime-local" name="date" value="${esc(f.date||dateNow())}"></label><label>結果 <select required name="status"><option value="">選択してください</option>${statuses.slice(1).map(s=>`<option ${s===f.status?'selected':''}>${s}</option>`).join('')}</select></label><label>訪問予定日時（日本時間）<input type="datetime-local" name="appointment" value="${esc(f.appointment||'')}"></label><label>次回連絡日（日本時間）<input type="date" name="next" value="${esc(f.next||'')}"></label><label class="wide">相手が使った言葉<textarea name="words" placeholder="相手の言い回しを、そのまま記録">${esc(f.words||'')}</textarea></label><label class="wide">メモ・次にすること<textarea name="note" placeholder="断りの背景、訪問時に聞きたいことなど">${esc(f.note||'')}</textarea></label></div><details><summary>補足の反応を記録する</summary><div class="formgrid">${fields.filter(([k])=>!['words','beauty','scope','reason'].includes(k)).map(([k,label])=>`<label>${label}${k==='first'||k==='price'?`<select name="${k}"><option value="">未記録</option>${(k==='first'?['良い','普通','悪い']:['はい','いいえ']).map(v=>`<option ${f[k]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<textarea name="${k}">${esc(f[k]||'')}</textarea>`}</label>`).join('')}</div></details><div class="savebar"><span class="muted">${LIVE?'TEL日・進捗を更新し、履歴を追加します。':'確認版のため、スプシへの保存はまだできません。'}</span><button class="primary" id="saveBtn" type="submit">${LIVE?'スプシに保存':'下書きを保存'}</button></div><p id="saveMessage" class="muted" role="status"></p></form></section><details class="panel" style="padding:16px 25px;margin-top:18px"><summary>この店舗の記録履歴</summary>${data.history.filter(h=>String(h.id)===selected.No).reverse().map(historyHtml).join('')||'<p class="muted">まだ記録がありません。</p>'}</details></div><aside class="aside panel branch-panel"><h3>相手の反応に合わせる</h3><div class="muted" style="margin-bottom:14px">クリックで読む文章が切り替わります</div><div class="buttons" id="branches"></div><div class="group">会話の着地</div><div class="buttons"><button onclick="go(3)">日程を相談する</button><button onclick="go(11)" style="color:#216348;border-color:#b3d8c3">アポが取れた</button><button onclick="endCall()">電話を終える・記録へ</button></div></aside></div>`;$('#recordForm').addEventListener('input',()=>{pending=null;saveDraft(false)});$('#recordForm').onsubmit=saveRecord;renderScript()}
function getForm(){return Object.fromEntries(new FormData($('#recordForm')).entries())}
function saveDraft(announce){if(!selected||!$('#recordForm'))return;drafts[draftKey()]=getForm();try{localStorage.setItem(key,JSON.stringify(drafts));$('#draftStatus').textContent='この端末に下書き保存';if(announce)toast('下書きを保存しました。スプシへの反映は連携設定後に行えます。')}catch{$('#draftStatus').textContent='下書きを保存できません';toast('端末への保存に失敗しました。入力内容を控えてください。')}}
function go(n){if(saving)return;if(n===step)return;if(n<4){returnStep=n;branchTrail=[]}else{if(step<4){returnStep=step;branchTrail=[]}else branchTrail.push(step)}step=n;path.push(titles[n]);renderScript();$('#script').scrollIntoView({behavior:'smooth',block:'start'})}
function returnToFlow(){go(returnStep)}
function previousResponse(){if(!branchTrail.length)return;step=branchTrail.pop();path.push('前の応答へ：'+titles[step]);renderScript()}
function flowButtons(){if(step<4)return `<button onclick="go(${Math.max(0,step-1)})" ${step===0?'disabled':''}>前へ</button>${step<3?`<button class="primary" onclick="go(${step+1})">次へ · ${esc(titles[step+1])}</button>`:'<button class="primary" onclick="endCall()">電話を終えて記録する</button>'}`;return `<div class="buttonrow"><button class="primary" onclick="returnToFlow()">元の話に戻る · ${esc(titles[returnStep])}</button>${branchTrail.length?'<button onclick="previousResponse()">前の応答に戻る</button>':''}<button onclick="go(3)">日程の相談へ進む</button><button onclick="endCall()">電話を終えて記録する</button></div>`}
function renderScript(){const chunks=scripts(data.scripts)[step];$('#steps').innerHTML=titles.slice(0,4).map((t,i)=>`<button class="${step===i?'active':''}" onclick="go(${i})">${i+1}. ${t.replace('体験への興味をつくる','体験').replace('用件を短く伝える','用件').replace('最初の入り方','導入').replace('日程を相談する','日程')}</button>`).join('');$('#branches').innerHTML=titles.slice(4,11).map((t,i)=>`<button class="${step===i+4?'active':''}" onclick="go(${i+4})">${esc(t)}</button>`).join('');$('#script').innerHTML=`<div class="eyebrow">${esc(scriptSheet)} · ${step<4?'基本の流れ '+(step+1)+'/4':'相手への応答'}</div><h2>${esc(titles[step])}</h2>${step>=4?`<p class="muted">元の流れ：${esc(titles[returnStep])} · 別の反応には右側のボタンから対応できます。</p>`:''}<div class="script-text">${chunks.map(t=>t.startsWith('※')||['一旦、相手の反応を見る。','全部説明しない。','隠さず答える。','ここで反応を見る。','それでもNOなら深追いしない。','→ アポへ。','ポイント','2つの候補をこちらから出す。','答えてもらえたら、それ自体を記録する。','で終了。','すぐ資料だけ送って終わらせない。'].includes(t)?`<div class="script-note">${esc(t)}</div>`:`<p>${esc(t)}</p>`).join('')}</div><div class="script-nav">${flowButtons()}</div>`}
function endCall(){if(step===11&&!$('#recordForm').elements.status.value)$('#recordForm').elements.status.value='アポ獲得';saveDraft(false);$('.record').scrollIntoView({behavior:'smooth'});$('#recordForm').elements.status.focus({preventScroll:true})}
async function saveRecord(e){e.preventDefault();if(saving)return;if(!LIVE){saveDraft(true);return}const f=getForm();if(f.status==='アポ獲得'&&!f.appointment){$('#saveMessage').textContent='アポ獲得の場合は訪問予定日時を入力してください。';return}pending=pending||{...f,id:selected.No,name:selected['店名'],expectedDate:selected['TEL日']||'',expectedStatus:selected['進捗']||'',requestId:crypto.randomUUID(),path:path.join(' → '),version:scriptSheet,listSheet,scriptSheet};saving=true;$('#recordForm').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);$('#saveBtn').disabled=true;$('#saveBtn').textContent='保存中…';$('#saveMessage').textContent='';try{const result=await rpc('saveRecord',pending);selected['TEL日']=result.date;selected['進捗']=result.status;data.history.push({...pending});delete drafts[draftKey()];try{localStorage.setItem(key,JSON.stringify(drafts))}catch{}pending=null;$('#draftStatus').textContent='スプシに保存済み';$('#saveMessage').textContent='保存しました。リストのTEL日・進捗と「架電記録」に反映済みです。';$('#recordForm').querySelectorAll('input,select,textarea').forEach(el=>{if(el.type==='radio')el.checked=false;else if(el.name!=='operator')el.value=''});$('#recordForm').elements.date.value=dateNow();toast('スプシに保存しました');if(versionRecords(data.history,scriptSheet).length%5===0)toast('同じスクリプトの5件がそろいました。「振り返りを開く」で比較できます。')}catch(err){$('#saveMessage').textContent='保存できませんでした：'+err.message+' 入力は残しています。'}finally{saving=false;$('#recordForm').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=false);$('#saveBtn').disabled=false;$('#saveBtn').textContent='スプシに保存'}}
const probes=[['opinionReaction','① 美容商品の意見を聞きたい',['話を聞いてくれた','警戒された','判断できず','話せず'],'opinionWords'],['soilReaction','② 身体の土壌から整える',['興味あり','反応なし','否定的','判断できず','話せず'],'soilWords'],['scopeReaction','③ マイクロスコープで見られる',['好転','変化なし','悪化','判断できず','話せず'],'scopeWords']];
function evaluationForm(f){return `<h3>3つの検証ポイント</h3><p class="muted">話せなかった場面は「話せず」。反応を推測せず、実際の言葉を残します。</p>${probes.map(([key,title,options,words])=>`<fieldset style="border:1px solid var(--line);border-radius:8px;padding:16px;margin:16px 0"><legend>${title}</legend><div class="buttonrow">${options.map(v=>`<label style="display:flex;align-items:center;gap:6px;padding:7px;border:1px solid var(--line);border-radius:6px"><input type="radio" name="${key}" value="${v}" ${f[key]===v?'checked':''} style="width:auto;margin:0">${v}</label>`).join('')}</div><label style="margin-top:12px">相手が実際に言った言葉<textarea name="${words}">${esc(f[words]||'')}</textarea></label></fieldset>`).join('')}<div class="formgrid" style="margin-bottom:24px">${[['hookWhere','食いついた箇所'],['guardWhere','警戒された箇所']].map(([key,title])=>`<label>${title}<select name="${key}"><option value="">未記録</option>${[...titles,'該当なし','その他'].map(t=>`<option ${f[key]===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label>そのときの相手の言葉<textarea name="${key==='hookWhere'?'hookWords':'guardWords'}">${esc(f[key==='hookWhere'?'hookWords':'guardWords']||'')}</textarea></label>`).join('')}<label class="wide">断られたときの言葉（そのまま）<textarea name="refusalWords">${esc(f.refusalWords||f.reason||'')}</textarea></label></div>`}
function versionRecords(history,version){return history.filter(h=>(h.scriptSheet||h.version)===version)}
function reviewBatches(history,version){const rows=versionRecords(history,version);const batches=[];for(let i=0;i<rows.length;i+=5)batches.push(rows.slice(i,i+5));return batches}
function showReview(version=scriptSheet,batch=null){if(saving)return;view='review';const versions=[...new Set([...Object.keys(data.scriptSets),...data.history.map(h=>h.scriptSheet||h.version).filter(Boolean)])];const batches=reviewBatches(data.history,version);const index=batch===null?Math.max(0,batches.length-1):Math.max(0,Math.min(Number(batch),batches.length-1));const rows=batches[index]||[];$('#app').innerHTML=`<button onclick="showList()">← 店舗リスト</button><h1 style="margin-top:24px">5件の反応を比較する</h1><p class="muted">${esc(listSheet)} · アポの成否だけでなく、相手の言葉から次の変更点を考えます。</p><div class="filters"><label>スクリプト<select id="reviewVersion">${versions.map(v=>`<option ${v===version?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>比較する5件<select id="reviewBatch">${batches.map((b,i)=>`<option value="${i}" ${i===index?'selected':''}>${i*5+1}〜${i*5+b.length}件目（${b.length}/5件）</option>`).join('')||'<option>記録なし</option>'}</select></label></div>${rows.length?`<p>${rows.length}件中 アポ獲得 ${rows.filter(h=>h.status==='アポ獲得').length}件${rows.length<5?' · 5件になる前でも確認できます。':''}</p><section class="panel table-scroll"><table><thead><tr><th>検証項目</th>${rows.map(h=>`<th style="min-width:220px">${esc(h.name)}<br>${esc(h.date)}<br>${esc(h.operator||'')}</th>`).join('')}</tr></thead><tbody>${[['status','結果'],...probes.flatMap(([k,t,o,w])=>[[k,t],[w,'相手の言葉']]),['hookWhere','食いついた箇所'],['hookWords','その言葉'],['guardWhere','警戒された箇所'],['guardWords','その言葉'],['refusalWords','断られた言葉'],['path','会話の流れ']].map(([k,t])=>`<tr><th>${esc(t)}</th>${rows.map(h=>`<td style="vertical-align:top;white-space:pre-wrap">${esc(h[k]||(k==='refusalWords'?h.reason:'')||'未記録')}</td>`).join('')}</tr>`).join('')}</tbody></table></section><p class="muted">旧版で取っていない項目は「未記録」です。「話せず」や「反応なし」に置き換えません。</p>`:'<div class="panel empty">このスクリプトの保存済み記録はありません。連携版で電話の結果を保存すると表示されます。</div>'}<p>振り返りの観点：残す言葉／変更する言葉／次の5件で確かめること。改訂時は新しいスクリプトシートを追加してください。</p>`;$('#reviewVersion').onchange=()=>showReview($('#reviewVersion').value);$('#reviewBatch').onchange=()=>showReview(version,$('#reviewBatch').value)}


let activeSubject='';
function signIn(){
 $('#authPanel').hidden=false;$('#authPanel').innerHTML='<div class="panel" style="padding:24px"><h2>Googleアカウントでログイン</h2><p>利用を許可されたアカウントでログインしてください。</p><div id="googleButton"></div><p id="loginError" role="status"></p><button onclick="signIn()">再試行</button></div>';
 EstheAPI.renderLogin($('#googleButton'),async user=>{
  $('#authPanel').hidden=true;
  if(activeSubject!==user.sub){data=null;selected=null;pending=null;key='esthe-pages-drafts-'+user.sub;drafts=readLocal();}
  activeSubject=user.sub;$('#setupBtn').textContent='ログアウト';$('#setupBtn').onclick=signOut;
  if(!data)await load();else toast('再ログインしました。入力を続けられます。');
 },e=>{$('#loginError').textContent=e.message;});
}
function signOut(){if(saving){toast('保存が終わるまでお待ちください。');return;}EstheAPI.logout();data=null;selected=null;pending=null;drafts={};activeSubject='';$('#app').innerHTML='';$('#banner').textContent='ログアウトしました。';signIn()}
$('#setupBtn').onclick=signOut;
window.addEventListener('esthe-auth-required',()=>{$('#setupBtn').textContent='再ログイン';$('#setupBtn').onclick=signIn;toast('認証が切れました。再ログイン後に同じ入力で再試行してください。');});
window.addEventListener('beforeunload',e=>{if(saving){e.preventDefault();e.returnValue='保存中です'}});
window.addEventListener('gis-ready',()=>{if(!EstheAPI.profile)signIn()});
$('#banner').textContent='ログインすると店舗リストを読み込めます。';signIn();
