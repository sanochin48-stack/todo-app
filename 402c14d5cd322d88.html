<title>PCM 組織活用ツール</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#FFF; --ink:#1B2430; --ink2:#5A6675; --ink3:#8A94A2;
  --line:#DCE2E9; --line2:#EDF0F4; --chrome:#33455E;
  --ok-bg:#E9F3EC; --ok-ink:#1F4A30;
  --ng-bg:#FDECEC; --ng-ink:#7A2020;
  --wa-bg:#FFF6DF; --wa-ink:#6B4E0A;
  --tabh:60px;
  /* 南京錠（塗りつぶし。currentColor をマスクで載せる） */
  --lock:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V7a3 3 0 0 1 3-3zm0 10a1.6 1.6 0 0 1 .8 3l.3 2.2h-2.2l.3-2.2A1.6 1.6 0 0 1 12 14z"/></svg>');
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,textarea,input{-webkit-appearance:none;appearance:none;border-radius:0}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-size:15px; line-height:1.75; -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom));
  overflow-wrap:break-word; word-break:break-word;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--chrome);outline-offset:2px}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

.top{
  background:var(--chrome);color:#fff;padding:11px 16px;
  position:sticky;top:0;z-index:20;display:flex;align-items:center;
  padding-top:calc(11px + env(safe-area-inset-top));
}
.top .ttl{font-size:15px;font-weight:700;letter-spacing:.06em}
.top .who{margin-left:auto;font-size:11.5px;opacity:.8;text-align:right}
.back{background:none;border:0;color:#fff;padding:0 12px 0 0;font-size:19px;line-height:1}

.page{padding:14px;max-width:720px;margin:0 auto}
.page[hidden]{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.card-h{padding:10px 14px;border-bottom:1px solid var(--line2);
        font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--ink2)}
.card-b{padding:14px}
.card-b p{margin:0 0 9px}
.card-b p:last-child{margin-bottom:0}

.lab{font-size:11px;color:var(--ink3);letter-spacing:.1em;display:block;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--ink2);line-height:1.7}
.tiny{font-size:11.5px;color:var(--ink3);line-height:1.7}
.exl{margin:1px 0 7px;padding-left:1.15em;font-size:13.5px;color:var(--ink2);line-height:1.8}
.exl li{margin-bottom:3px}
.chip{display:inline-block;background:#EEF1F5;color:var(--ink2);
      border-radius:3px;padding:3px 10px;font-size:12.5px;margin:0 5px 6px 0}
.kv{display:flex;padding:6px 0;border-bottom:1px dotted var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{flex:0 0 104px;color:var(--ink2);font-size:12px}
@media (max-width:400px){ .kv{display:block} .kv .k{display:block;margin-bottom:1px} }
.kv .v{flex:1 1 auto}
.note-ok{background:var(--ok-bg);color:var(--ok-ink);border-radius:6px;padding:11px 13px;font-size:13px;line-height:1.75}
.note-wa{background:var(--wa-bg);color:var(--wa-ink);border-radius:6px;padding:11px 13px;font-size:13px;line-height:1.75}
.step{border-left:3px solid var(--chrome);padding:2px 0 2px 12px;margin-bottom:14px}
.step:last-child{margin-bottom:0}
.step .hd{font-size:11px;color:var(--ink3);display:block;margin-bottom:3px;letter-spacing:.06em}
.step .tx{font-size:14.5px;line-height:1.8}

/* ---- コンドミニアム（二重枠カード） ---- */
.pc{border:9px solid var(--line);border-radius:9px;padding:11px;background:var(--surface)}
.pc-in{border:4px solid var(--line);border-radius:5px;padding:16px 14px;position:relative}
.pc-bc{position:absolute;top:6px;right:9px;font-size:11px;color:var(--ink2);
       letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
.pc-in.hasbc{padding-top:30px}
.pc-nm{margin:0 0 14px;text-align:center;font-size:19px;font-weight:700;letter-spacing:.06em}
.fr{display:flex;align-items:center;margin-bottom:6px}
.fr:last-child{margin-bottom:0}
.fr .tn{width:88px;flex:0 0 auto;font-size:11.5px;white-space:nowrap}
.fr .tk{flex:1 1 auto;display:block;height:16px;background:#F0F2F5;border-radius:3px}
.fr .bb{display:block;height:16px;border-radius:3px;min-width:4px}
.fr.g .tn{font-weight:700}
.pc-cap{margin:11px 2px 0;font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.8}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;position:relative;top:1px}
.pcwrap{margin-bottom:14px}
.pcwrap .pc{border-width:7px;padding:9px}
.pcwrap .pc-in{border-width:3px;padding:12px}
.pcwrap .pc-in.hasbc{padding-top:26px}
.pcwrap .fr{margin-bottom:5px}
.pcwrap .fr .tk,.pcwrap .fr .bb{height:14px}
.pcwrap .pc-cap{margin-top:9px;font-size:11px}

/* ---- 開閉できる項目行 ---- */
.ex{border-bottom:1px dotted var(--line2)}
.ex:last-of-type{border-bottom:0}
.ex > summary{display:flex;align-items:baseline;gap:12px;padding:9px 0;font-size:13.5px;list-style:none}
.ex > summary::-webkit-details-marker{display:none}
.ex > summary .k{flex:0 0 8.6em;color:var(--ink2);font-size:12px;line-height:1.5}
.ex > summary .v{flex:1 1 auto}
.ex > summary .m{flex:0 0 auto;color:var(--ink3);font-size:13px;line-height:1}
.ex[open] > summary .m::before{content:"−"}
.ex > summary .m::before{content:"＋"}
.ex .exb{font-size:13px;line-height:1.9;color:var(--ink2);background:#F5F7FA;
         border-radius:6px;padding:10px 12px;margin:0 0 10px}
.ex.flat > summary{cursor:default}
@media (max-width:400px){
  .ex > summary{display:block;position:relative;padding-right:20px}
  .ex > summary .k{display:block;margin-bottom:1px}
  .ex > summary .m{position:absolute;right:0;top:10px}
}

/* ---- ツインタワー（やりとり） ---- */
.twin{position:relative;display:flex;margin-bottom:10px}
.twin .col{flex:1 1 0;min-width:0}
.twin .gap{flex:0 0 30px;width:30px}
.twin .ch{text-align:center;font-size:10.5px;color:var(--ink3);margin-bottom:5px;line-height:1.4}
.twin .ch b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.tf{position:relative;background:var(--surface);border:1px solid var(--line2);border-bottom:0;
    padding:4px 6px 6px;overflow:hidden}
.col .tf:first-of-type{border-radius:6px 6px 0 0}
.col .tf:last-of-type{border-bottom:1px solid var(--line2);border-radius:0 0 6px 6px}
.tf .lv{display:block;font-size:9px;color:var(--ink3);line-height:1.2}
.tf .tn{display:block;font-size:11px;line-height:1.45}
.tf .bb2{display:block;height:3px;border-radius:1px;margin-top:3px;min-width:3px}
.tf .mk{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;box-sizing:border-box}

"},"ハーモナイザー":{"認知":"心情（思いやり）","認知+":"人間関係を重んじる。周りの人々や状況について、心で感じることによって外の世界を捉える。家族や友情を大切にする。用いる通貨は「思いやり」。／よく使う言葉：「私は～と感じます」「私は～心地よい」「私は～気にかける」「～幸せ」「～悲しい」「私は～愛しています」「～親しい」","強み":"思いやり、豊かな感受性、温かさ","強み+":"人を育み「与える」能力。調和を生みだすのが上手。","苦手意識":"6階は、いちばん使う経験が少ない階。心情・思いやりの認知を使う機会が少ないため、気持ちや関係性を大切にする人、人として受け容れられることを求める人と接するときに難しさを感じやすい。"},"イマジナー":{"認知":"内省（想像）","認知+":"指示を受けることを重んじる。起きていることについて思いを巡らせることで外の世界を捉える。プライバシーや自分だけの空間を大切にする。用いる通貨は「想像」。／よく使う言葉：「よくわかりません…」「指示を待ちます…」「控えておこう…」「無理のないペースで…」「自分だけの時間／空間を…」「平穏でいたい…」","強み":"豊かな想像力、内省的、物静か","強み+":"冷静に物事を振り返って内省する能力。物事や与えられた仕事をきちっとこなす。器用さが要求される仕事を得意とする。","苦手意識":"6階は、いちばん使う経験が少ない階。内省・想像の認知を使う機会が少ないため、静かに考える人、自分だけの時間と空間を必要とする人と接するときに難しさを感じやすい。"},"レベル":{"認知":"反応（ユーモア）","認知+":"楽しさを重んじる。周りの人々や状況に対して、好き嫌いで反応することで外の世界を捉える。自発性や創造性を大切にする。用いる通貨は「ユーモア」。／よく使う言葉：「えーっ！」「～好き」「～好きじゃない（嫌い）」「～したくない」、および楽しいくだけた表現","強み":"自由奔放、クリエイティブ、遊び心に溢れる","強み+":"遊び心を持って今を楽しむ能力。","苦手意識":"6階は、いちばん使う経験が少ない階。反応・ユーモアの認知を使う機会が少ないため、好き嫌いで率直に反応する人、楽しい接触を求める人と接するときに難しさを感じやすい。"},"プロモーター":{"認知":"行動（魅力）","認知+":"イニシアティブを重んじる。実際に体験すること、自ら事を起こすことによって外の世界を捉える。順応性や「自分のことは自分でする」ことを大切にする。用いる通貨は「（人を惹きつける）魅力」。／よく使う言葉：「要は～」「～決めた」「～しないと始まらない」「～やるだけ」「結論から言って」","強み":"環境適応力、（人に行動を起こさせる）説得力、人を惹きつける魅力","強み+":"決断が早く、ストレートに物事を進める能力。","苦手意識":"6階は、いちばん使う経験が少ない階。行動・魅力の認知を使う機会が少ないため、結論と行動を急ぐ人、刺激やチャレンジを求める人と接するときに難しさを感じやすい。"}},"ktItems":["認知","強み"],"basicOnly":[],"team":{"シンカー":{"比較的多い":"事実・根拠・現実性・効率などを確認する視点が出やすい。","確認する視点":"根拠は？／現実的？／もっと効果的にできる？"},"パシスター":{"比較的多い":"重要性・意義・価値・『どうあるべきか』を考える視点が出やすい。","確認する視点":"何が重要？／この取り組みの意義は？／何を大切にする？"},"ハーモナイザー":{"比較的多い":"人への影響・気持ち・関係性・負担への視点が出やすい。","確認する視点":"誰にどんな影響がある？／みんなの負担や気持ちは？"},"イマジナー":{"比較的多い":"一度考える、頭の中で整理する、静かに検討する視点が出やすい。","確認する視点":"一度立ち止まって考える時間は取れている？／考える余白はある？"},"レベル":{"比較的多い":"反応・面白さ・自由なアイデア・場の活性化につながる視点が出やすい。","確認する視点":"面白くできない？／別のアイデアは？／楽しく取り組める？"},"プロモーター":{"比較的多い":"行動・結果・スピード・次の一手へ意識が向きやすい。","確認する視点":"結局どうする？／次の一手は？／まず何をやる？"}},"micro":["自分の「当たり前」が、相手の「当たり前」とは限らない。","受け取り方は、一つではない。","違いは、間違いではない。単に、違うだけ。","同じ言葉でも、受け取り方は人それぞれ。","違いはあっても、誰もが6つのタイプを持っている。","相手が見ている世界はどんな世界？","タイプがわかっても、その人自身のことがわかったわけではない。","タイプを知ったところから、その人を知ることが始まる。","コンドミニアムは答えではなく、その人を知るための一つの仮説であり、手掛かり。さあ、ここからがスタート。","コンドミニアムを見たら、次はその人そのものを観察しよう。","タイプが同じでも、人は同じじゃない。","仮説を持ったら、目の前の相手をよく観察する。","コンドミニアムの横幅の長さは、能力の高さではなく、自分の中のバランス。","「きっと～に違いない」と決めつける前に、相手に尋ねてみよう。","相手がどう受け取ったか、尋ねてみよう。","コミュニケーションの正解があるとしたら、その相手との間にしかない。だから、相手に聞かないと、本当のところはわからないまま。","自分の受け取り方を、変えてみる。","相手は同じでも、自分の受け取り方は変えられる。","コミュニケーションとは、相手が伝えたいことを理解すること。","「何を」伝えるかよりも、「どのように」伝えるか。","コミュニケーションには、伝える技術と受け取る技術がある。","伝えたことと、伝わったことは同じとは限らない。","自分に伝わる言い方が、相手にも伝わるとは限らない。","PCMはスキルだけど、中身が伴わなければ伝わらない。","相手は変えられなくても、自分の関わり方は変えられる。","相手に合わせることは、自分を曲げることではない。","ときには、距離を置くことも大切な関わり方。","相手に合わせて伝え方を変えるのは、コミュニケーションの近道。","自分の機嫌は、自分でとる。","心には、晴れの日もあれば雨の日もある。","自分を満たすことも、コミュニケーションの一部。","誰もが、心のエネルギーを必要としている。","心が満たされなければ、誰にでも「いつもと違う」は起こる。","心理的欲求は、心のごはん。心にも、毎日の栄養補給を。","自分という車がちゃんと動くかは、心理的欲求というガソリンが鍵。","今日、いちばん話しにくいと感じている相手は誰だろう？","あの言い方、相手にはどう届いただろう？","「わかってくれない」と感じたとき、自分は何を伝えていただろう？","いま自分は、どの階から話しているだろう？","相手が黙っているとき、何が起きているんだろう？","最近、自分の心理的欲求は満たせているだろうか？"],"intro":{"lines":[{"strong":true,"text":"人は、同じものを見ても、同じようには受け取りません。"},{"strong":false,"text":"自分の「当たり前」が、相手の「当たり前」とは限らない。"},{"strong":false,"text":"受け取り方は、一つじゃない。"},{"strong":true,"text":"それでいいんです。"},{"strong":false,"text":"PCMは、人をタイプで決めつけるためのものではありません。"},{"strong":false,"text":"違いを知ることで、関わり方の選択肢を増やすためのものです。"},{"strong":false,"text":"ときには、相手より先に、自分自身の状態に目を向ける。"},{"strong":true,"text":"答えは、ここにはありません。"},{"strong":true,"text":"答えは、目の前の相手の中にあります。"},{"strong":true,"text":"PCMを、「知っている」から「使える」へ。"}],"button":"はじめる"},"needs":{"シンカー":{"needs":["仕事の承認（能力・手法・成果）","時間の枠組み"],"work":["仕事の優先順位と予定を整理する","終えた仕事や達成したことを確認する","自分が良い仕事をしたとき、自分を認める"],"life":["休日や自分の時間にも予定をつくる","家族や友人と過ごす時間を予定に入れる","達成感を得られるスポーツや運動をする"]},"パシスター":{"needs":["仕事の承認（取り組む姿勢）","信念・確信"],"work":["自分が納得のいく仕事ができたとき、自分を認める","意見交換を行い、建設的なフィードバックをもらう","自分がブレていないか、ミッションステートメントを再確認する"],"life":["納得のいくスローガンや信条を作成して掲示する","同じ価値観や信念を持つ人と交流する","自分が重要だと思う活動や社会貢献に参加する"]},"ハーモナイザー":{"needs":["一人の人として無条件に受け容れられること","感覚的な心地よさ"],"work":["気持ちを大切にしてくれる人と一緒に仕事をする","自分のことを気にかけてもらえる人との時間をつくる","職場を心地よく感じられる環境にする"],"life":["大切な人と一緒に過ごす時間をつくる","思い出の写真や愛情を感じられるものを飾る","いい香りのするアロマやお香を焚いてリラックスする"]},"イマジナー":{"needs":["自分だけの（独りの）時間・空間"],"work":["邪魔されず、一人で集中できる時間をつくる","静かに考えたり、アイデアを練ったりする時間を確保する","一人で仕事ができる場所や環境を確保する"],"life":["朝や夕方に独りで散歩をする","独りで出来る趣味をはじめる","自分のためだけの休暇をとる"]},"レベル":{"needs":["楽しい接触"],"work":["気の合う人と楽しく話せる時間をつくる","仕事の合間に身体を動かしたり、気分転換をする","自分の周りに好きな物や楽しい刺激を取り入れる"],"life":["友人や仲間と楽しい時間を過ごす","音楽・ゲーム・遊びなど、好きなことを楽しむ","楽しみながら身体を動かす"]},"プロモーター":{"needs":["エキサイティングな事が起こること／起こすこと"],"work":["新しいことや、チャレンジできる仕事に取り組む","人より高い目標を設定し挑戦する","困難なミッションを遂行できる者として認められる"],"life":["新しい場所や未経験のことに挑戦する","刺激やスリルを感じられる活動を楽しむ","短期間で達成感を得られることに取り組む"]}},"tsutae":null,"uke":null,"distress":{"シンカー":{"初期表示1":"過剰な弁明・説明をする","初期表示2":"人に仕事を任せられず、自分でやってしまう","第1段階":"完全さを自分に求め過ぎる。説明し過ぎる／他人の代わりに考え過ぎる／委任できず自分で抱える。","第2段階":"過剰にコントロールする。時間・公平さ・責任などに苛立ち、相手の考え方を批判する。","第3段階":"相手を拒絶・見限る。"},"パシスター":{"初期表示1":"何が正しいかより、何が間違っているかに焦点を当てる","初期表示2":"複雑でややこしい質問をする","第1段階":"完全さを相手に求め過ぎる。間違いに焦点を当て、条件付けや複雑な質問が増える。","第2段階":"信念を押し付ける。独断的・独善的・説教がましくなり、異なる信念を批判する。","第3段階":"相手を見限る。"},"ハーモナイザー":{"初期表示1":"相手に合わせ過ぎる","初期表示2":"意思決定の際に、過度に優柔不断になる","第1段階":"人を喜ばせようとして相手に過剰適応する。優柔不断になり、自分の意見・希望を言いにくくなる。","第2段階":"ミス、自己不信、批判を招く言動、自分を卑下する言動が増える。","第3段階":"拒絶感を抱き、『誰からも求められていない』感覚へ進む。"},"イマジナー":{"初期表示1":"自分を外に表さな過ぎる","初期表示2":"自ら行動を起こすことを避ける","第1段階":"強くあろうとして、自分を外に表さず、自発的な行動を避ける。","第2段階":"消極的に待つ／引きこもる／始めたことを終えにくくなる。","第3段階":"独り取り残された感覚が強まり、何をすればよいか分からなくなる。"},"レベル":{"初期表示1":"理解しようと一生懸命になるが『できない』となる","初期表示2":"何も指示せず、丸投げして相手にやらせる","第1段階":"頑張り過ぎ、理解しようとして『できない』となる。不適切に人へ丸投げする。","第2段階":"責任転嫁・不平不満・ネガティブな批判が増え、『うん、そうだけどさぁ...』が出る。","第3段階":"非難・拒絶を招き、仕返し的な反応へ進む。"},"プロモーター":{"初期表示1":"他者のサポートをしない","初期表示2":"切り離す","第1段階":"相手に強さを求め、十分なサポートをせず『自分のことは自分で』を当然視する。","第2段階":"操作する。規則を破る・無視する、状況を自分に都合よく歪曲する、ネガティブなドラマや対立を作る。","第3段階":"相手を見捨てる。"}},"guard":"この情報は、相手の状態を決めつけるためのものではありません。普段との違いに気づき、関わり方を考えるためのヒントとして活用してください。","project":null,"meeting":null}}</script>
<script>
(function(){
'use strict';

var D = JSON.parse(document.getElementById('appdata').textContent);
var M = D.m || {};
var V = D.viewer || { learning:'basic', canViewOthers:true };
var TYPES = ['シンカー','パシスター','ハーモナイザー','イマジナー','レベル','プロモーター'];
var COLOR = { 'シンカー':'#32A2FF','パシスター':'#7F379D','ハーモナイザー':'#FC7403',
              'イマジナー':'#E3A88D','レベル':'#FAE200','プロモーター':'#E11933' };

var VIEW = 'self', CUR = null, SUBTAB = 'normal', TALK = 'send', SELFSEG = 'work', LEFT = null;
var PEOPLE = {}, RECS = [], STORE_OK = true, DUMP = false, RECDEL = null;
var PJ = { mode:'list', id:null, name:'', keys:{}, del:false };

function $(s){ return document.querySelector(s); }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function prof(k){ return D.profiles[k] || null; }
function isBasic(){ return V.learning === 'basic'; }
function canView(){ return !!V.canViewOthers; }

var TT = null;
function toast(msg){
  var el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(TT); TT = setTimeout(function(){ el.hidden = true; }, 2200);
}

/* ============ 権限（§13-7） ============ */
var LOCK_DESC = {
  talk:'相手の認知に合わせた伝え方と、受け取り方のズレを扱います。',
  fuel:'心理的欲求は本人が自分で満たすものです。ここでは、その手がかりを扱います。',
  off :'普段との違いに気づくための情報です。人を判断するためのものではありません。'
};
function lockCond(need){
  var wantB = !isBasic(), wantM = (need === 'mg') && !canView();
  if (wantB && wantM) return 'この機能はBasic受講と、マネジメント権限の設定が必要です。';
  if (wantB) return 'この機能はBasic受講後に使えます。';
  if (wantM) return 'この機能はマネジメント権限の設定が必要です。';
  return null;
}
var SUBTABS = [
  { id:'normal', name:'普段',        need:'kt' },
  { id:'talk',   name:'やりとり',     need:'basic' },
  { id:'fuel',   name:'動機付け',     need:'mg' },
  { id:'off',    name:'ディストレス？', need:'mg' }
];
function subLocked(t){
  if (t.need === 'kt') return null;
  if (t.need === 'basic') return isBasic() ? null : lockCond('basic');
  return lockCond('mg');
}
function lockCard(cond, desc){
  return '<div class="lk"><span class="ic" role="img" aria-label="ロック"></span>' +
    '<p class="c">' + cond + '</p><p class="d">' + desc + '</p></div>';
}

/* ============ コンドミニアム ============ */
/* ベースを必ず1階に置き、他は rank の大きい順に上へ積む */
function floors(p){
  return TYPES.slice().sort(function(a,b){
    if (a === p.base) return 1;
    if (b === p.base) return -1;
    return (p.rank[b] - p.rank[a]) || (p.score[a] - p.score[b]);
  });
}
function floorNo(p, ty){ var o = floors(p); return o.length - o.indexOf(ty); }

function condoHtml(p, name, showB){
  var o = floors(p), h = '';
  o.forEach(function(ty, i){
    h += '<div class="fr' + (ty === p.base ? ' g' : '') + '">' +
      '<span class="tn">' + esc(ty) + '</span>' +
      '<span class="tk"><span class="bb" style="width:' + p.score[ty] + '%;background:' + COLOR[ty] + '"></span></span>' +
    '</div>';
  });
  return '<div class="pc" style="border-color:' + COLOR[p.base] + '">' +
    '<div class="pc-in' + (p.bcpc ? ' hasbc' : '') + '" style="border-color:' + COLOR[p.phase] + '">' +
      (p.bcpc ? '<span class="pc-bc">' + esc(p.bcpc) + '</span>' : '') +
      (name ? '<h3 class="pc-nm">' + esc(name) +
        (showB ? '<span class="bB">B</span>' : '') + '</h3>' : '') + h +
    '</div></div>';
}
function exHtml(list){
  return '<ul class="exl">' + (list || []).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
}

/* ============ 集計（§18-2 / A-1・A-2） ============ */
function tally(list){
  var seen = {}, total = 0, trained = 0, count = {};
  TYPES.forEach(function(t){ count[t] = 0; });
  list.forEach(function(p){
    if (seen[p.key]) return;
    seen[p.key] = 1; total++;
    var pr = prof(p.key);
    if (pr){ trained++; count[pr.base]++; }
  });
  return { total:total, trained:trained, count:count };
}
function tallyPhase(list){
  var seen = {}, trained = 0, count = {};
  TYPES.forEach(function(t){ count[t] = 0; });
  list.forEach(function(p){
    if (seen[p.key]) return;
    seen[p.key] = 1;
    var pr = prof(p.key);
    if (pr){ trained++; count[pr.phase]++; }
  });
  return { trained:trained, count:count };
}
function stage(n){ return n < 2 ? 'none' : (n < 4 ? 'ratio' : 'full'); }

function barHtml(t){
  if (!t.trained) return '';
  var h = '<div class="cbar" role="img" aria-label="ベース構成">';
  TYPES.forEach(function(ty){
    if (!t.count[ty]) return;
    h += '<i style="width:' + (t.count[ty] / t.trained * 100) + '%;background:' + COLOR[ty] + '"></i>';
  });
  return h + '</div>';
}
function legHtml(t){
  if (!t.trained) return '';
  var h = '<div class="cleg">';
  TYPES.forEach(function(ty){
    if (!t.count[ty]) return;
    h += '<span><b style="background:' + COLOR[ty] + '">.</b>' + ty + ' ' +
         t.count[ty] + '名・' + Math.round(t.count[ty] / t.trained * 100) + '%</span>';
  });
  return h + '</div>';
}
function commentHtml(t){
  var st = stage(t.trained);
  if (st === 'none') return '<p class="tiny">PCMを取得しているのが' + t.trained + '名のため、構成の傾向は表示しません。</p>';
  if (st === 'ratio') return '<p class="tiny">PCMを取得しているのが' + t.trained + '名のため、構成比のみを表示しています。多い・少ないの判定は行いません。</p>';
  var many = [], pick = [];
  TYPES.forEach(function(ty){
    var r = t.count[ty] / t.trained * 100;
    if (r >= 30) many.push(ty);
    else if (r < 10) pick.push(ty);
  });
  var h = '';
  if (many.length){
    h += '<p class="note-ok" style="margin-bottom:9px"><b>比較的多く見られる視点</b><br>' +
      many.map(function(ty){ return esc(ty) + '：' + esc((M.team[ty]||{})['比較的多い'] || ''); }).join('<br>') + '</p>';
  }
  if (pick.length){
    h += '<p class="note-wa"><b>意識して取り入れたい視点</b><br>' +
      pick.map(function(ty){ return esc((M.team[ty]||{})['確認する視点'] || ''); }).join('<br>') + '</p>';
  }
  return h || '<p class="tiny">構成に大きな偏りは見られません。</p>';
}

/* ============ 自分 ============ */
/* ベース由来の項目＋心理的欲求・ディストレスを1つのリストにする。
   「自分」画面とメンバーの「普段」で共通に使う。 */
function traitRows(pr, forSelf){
  var f = M.futsu[pr.base] || {};
  var kt = M.ktItems || ['認知','強み'];
  var order = [kt[0]];
  if (isBasic()) order = order.concat(M.basicOnly || []);
  order = order.concat(kt.slice(1));

  var h = '';
  order.forEach(function(k){
    h += exRow(k, f[k], f[k + '+'] ? esc(f[k + '+']) : '');
  });

  /* 6階が20以下なら「苦手意識があること」 */
  var top6 = floors(pr)[0];
  if (pr.score[top6] <= 20){
    var f6 = M.futsu[top6] || {};
    h += exRow('苦手意識があること', top6, f6['苦手意識'] ? esc(f6['苦手意識']) : '');
  }

  /* 心理的欲求（フェーズが主、ベースが違えば詳細に併記） */
  var main = pr.phase, sub = (pr.base !== pr.phase) ? pr.base : null;
  var nm = M.needs[main] || { needs:[] };
  var nd;
  if (sub){
    var s2 = M.needs[sub] || { needs:[] };
    nd = 'ベース（' + esc(sub) + '）の心理的欲求：' + esc(s2.needs.join('・')) +
      '<br>いま効いているのはフェーズ側です。心理的欲求は、本人が自分で満たすものです。';
  } else {
    nd = 'ベースとフェーズが同じため、心理的欲求は1組です。心理的欲求は、本人が自分で満たすものです。';
  }
  h += exRow('心理的欲求', nm.needs.join('・'), nd);

  /* ディストレス（フェーズ。開くと一連の流れ） */
  var d = (M.distress || {})[main];
  if (d){
    var dd = '';
    ['第1段階','第2段階','第3段階'].forEach(function(k){
      if (d[k]) dd += '<b style="display:block;font-size:11px;color:var(--ink3);font-weight:400;' +
        'letter-spacing:.06em;margin-top:8px">' + k + '</b>' + esc(d[k]);
    });
    /* 他者を見るときだけ、決めつけを戒める文言を添える */
    if (!forSelf && M.guard) dd += '<span style="display:block;margin-top:10px;color:var(--ink3);' +
      'font-size:12px">' + esc(M.guard) + '</span>';
    h += exRow('ディストレス', (d['初期表示1'] || '') + '／' + (d['初期表示2'] || ''), dd);
  }
  return h;
}

/* 開閉できる1行 */
function exRow(k, v, d){
  if (!v && !d) return '';
  return '<details class="ex' + (d ? '' : ' flat') + '">' +
    '<summary><span class="k">' + esc(k) + '</span>' +
    '<span class="v">' + esc(v || '') + '</span>' +
    (d ? '<span class="m"></span>' : '') + '</summary>' +
    (d ? '<div class="exb">' + d + '</div>' : '') + '</details>';
}

function renderSelf(){
  var pr = D.me.profile, main = pr.phase, sub = (pr.base !== pr.phase) ? pr.base : null;

      '新しい版を受け取ってください。記録は「記録」タブから保存して引き継げます。' +

  h += '<div class="card"><div class="card-h">自分について書く</div><div class="card-b">' +

/* ============ メンバー ============ */
/* 兼任＝2つ以上のチームのマネージャー。
   上位の管理職層（chart[0]）に名前が出ることは兼任ではない。 */
var MGRTEAMS = {};
function buildMgrTeams(){
  D.chart.slice(1).forEach(function(c){
    (c.tiers || []).forEach(function(tier){
      tier.forEach(function(p){ MGRTEAMS[p.key] = (MGRTEAMS[p.key] || 0) + 1; });
    });
  });
}
function isDup(key){ return (MGRTEAMS[key] || 0) >= 2; }

function buildPeople(){
  D.chart.forEach(function(c){
    (c.tiers || []).forEach(function(t){ t.forEach(reg); });
    (c.members || []).forEach(reg);
  });
  function reg(p){ if (!PEOPLE[p.key]) PEOPLE[p.key] = p; }
}
function unitPeople(c){
  var out = [];
  (c.tiers || []).forEach(function(t){ t.forEach(function(p){ out.push(p); }); });
  (c.members || []).forEach(function(p){ out.push(p); });
  return out;
}
function mrowHtml(p, alsoLabel){
  var pr = prof(p.key);
  var badge = (p.b ? '<span class="bB" title="Basic受講">B</span>' : '') +
              (alsoLabel ? '<span class="bAlso">' + esc(alsoLabel) + '</span>' : '');
  if (!pr){
    return '<div class="mrow na"><span class="bar"></span>' +
      '<span class="nm"><b>' + esc(p.name) + badge + '</b><span>タイプ未取得' +
      (p.role ? '　' + esc(p.role) : '') + '</span></span></div>';
  }
  return '<button class="mrow" data-person="' + esc(p.key) + '">' +
    '<span class="bar" style="background:' + COLOR[pr.base] + '"></span>' +
    '<span class="nm"><b>' + esc(p.name) + badge + '</b>' +
      '<span>' + esc(pr.base) + '／' + esc(pr.phase) + (p.role ? '　' + esc(p.role) : '') + '</span></span>' +
    '<span class="ar">›</span></button>';
}
function renderList(){
  /* 事業部の段を上から並べ、グループを率いる人の下にそのグループを入れ子にする */
  /* 1人が複数の組織の長を兼ねることがあるので、配列で持つ */
  var root = D.chart[0], rest = D.chart.slice(1), byLeader = {}, used = {};
  rest.forEach(function(c){
    var lead = c.tiers && c.tiers[0] && c.tiers[0][0];
    if (lead) (byLeader[lead.key] = byLeader[lead.key] || []).push(c);
  });

  function subBlock(c){
    used[c.name] = 1;
    var lead = c.tiers[0][0], t = tally(unitPeople(c)), rows = '';
    (c.members || []).forEach(function(p){
      if (p.key === D.me.key || p.key === lead.key) return;
      rows += mrowHtml(p, isDup(p.key) ? '兼任' : '');
    });
    if (!rows) return '';
    return '<div class="msub"><div class="stt">' + esc(c.name) +
      '　PCM取得 ' + t.trained + ' ／ ' + t.total + '</div>' +
      '<div class="mlist">' + rows + '</div></div>';
  }

  var h = '<div class="mgrp"><div class="stt">' + esc(root.name) + '</div>';
  (root.tiers || []).forEach(function(tier){
    tier.forEach(function(p){
      if (p.key !== D.me.key){
        h += '<div class="mlist">' + mrowHtml(p, isDup(p.key) ? '兼任' : '') + '</div>';
      }
      (byLeader[p.key] || []).forEach(function(sub){ h += subBlock(sub); });
    });
  });
  (root.members || []).forEach(function(p){
    if (p.key === D.me.key) return;
    h += '<div class="mlist">' + mrowHtml(p, isDup(p.key) ? '兼任' : '') + '</div>';
  });
  h += '</div>';

  /* 事業部にひもづかない組織は独立して並べる */
  rest.forEach(function(c){
    if (used[c.name]) return;
    var rows = '', seen = {};
    unitPeople(c).forEach(function(p){
      if (seen[p.key] || p.key === D.me.key) return;
      seen[p.key] = 1; rows += mrowHtml(p, isDup(p.key) ? '兼任' : '');
    });
    if (!rows) return;
    h += '<div class="mgrp"><div class="stt">' + esc(c.name) + '</div>' +
         '<div class="mlist">' + rows + '</div></div>';
  });

  h += '<p class="tiny" style="margin:4px">色は1階（ベース）です。名前を選ぶとコンドミニアムが開きます。</p>';
  $('#page-list').innerHTML = h;
}

/* ============ 個人 ============ */
function openPerson(key){
  if (key === D.me.key){ go('self'); return; }
  if (!prof(key)) return;
  CUR = key; SUBTAB = 'normal'; TALK = 'send'; LEFT = null; go('person');
}
function renderPerson(){
  var p = PEOPLE[CUR], pr = prof(CUR);
  if (!p || !pr){ go('list'); return; }
  $('#ttl').textContent = p.name;

  /* やりとりのときだけ、自分と相手のカードを並べる */
  var h = (SUBTAB === 'talk')
    ? twinBlock(pr, p.name)
    : '<div class="pcwrap">' + condoHtml(pr, p.name, !!p.b) + '</div>';
  h += '<div class="seg">';
  SUBTABS.forEach(function(t){
    var lk = subLocked(t);
    h += '<button data-sub="' + t.id + '" class="' + (SUBTAB === t.id ? 'on' : '') + (lk ? ' lk' : '') + '">' +
      t.name + '</button>';
  });
  h += '</div>';

  var cur = SUBTABS.filter(function(t){ return t.id === SUBTAB; })[0];
  var lk2 = subLocked(cur);
  h += lk2 ? lockCard(lk2, LOCK_DESC[cur.id])
           : ({ normal:paneNormal, talk:paneTalk, fuel:paneFuel, off:paneOff })[cur.id](pr, p);

  /* やりとりは「伝え方」「受け取り方」を別の項目として扱う */
  var logName = (cur.id === 'talk') ? (TALK === 'send' ? '伝え方' : '受け取り方') : cur.name;

  h += '<div class="card"><div class="card-h">この人について書く　' + esc(logName) + '</div><div class="card-b">' +
    '<textarea class="memo" placeholder="やってみたこと、気づいたこと"></textarea>' +
    '<p class="tiny" style="margin-top:8px">キーボードのマイクボタンから、音声でも入力できます。</p>' +
    '<div class="btnrow"><button class="btn" data-recadd="' + esc(CUR) + '" data-rectab="' + esc(logName) + '">記録する</button></div>' +
    '</div></div>';

  var logs = RECS.filter(function(r){ return r.key === CUR && r.tab === logName; });
  if (logs.length){
    h += '<div class="card"><div class="card-h">' + esc(logName) + 'の記録　' + logs.length + '件</div>' +
      '<div class="card-b">' + logs.map(logRow).join('') + '</div></div>';
  }
  $('#page-person').innerHTML = h;
  if (SUBTAB === 'talk') drawWire();

window.addEventListener('resize', function(){
  if (VIEW === 'person' && SUBTAB === 'talk') drawWire();
});

function paneNormal(pr){
  return '<div class="card"><div class="card-h">普段の手がかり　ベース：' + esc(pr.base) + '</div>' +
    '<div class="card-b">' +
      '<p class="tiny" style="margin-bottom:10px">項目を押すと、詳しい説明が開きます。</p>' +
      traitRows(pr, false) +
      '<p class="tiny" style="margin-top:12px">ベースを手がかりにした特徴と、いまのフェーズの状態です。' +
      '決めつけずに、目の前の相手を見てください。</p>' +
    '</div></div>';
}

function towerHtml(p, side, cap, name, markType){
  var o = floors(p), h = '';
  o.forEach(function(ty, i){
    var mk = (ty === p.base) ? '<span class="mk" style="background:' + COLOR[ty] + '"></span>'
           : (ty === p.phase) ? '<span class="mk ring" style="border-color:' + COLOR[ty] + '"></span>' : '';
    h += '<div class="tf' + (ty === markType ? ' on' : '') + '">' +
      '<span class="lv">' + (o.length - i) + 'F</span>' +
      '<span class="tn">' + esc(ty) + '</span>' +
      '<span class="bb2" style="width:' + p.score[ty] + '%;background:' + COLOR[ty] + '"></span>' +
      mk + '</div>';
  });
  return '<div class="col ' + side + '"><div class="ch">' + esc(cap) +
    '<b>' + esc(name) + '</b></div>' + h + '</div>';
}

/* 左の棟に立てる人。自分と、その人のマネージャー */
function leftChoices(key){
  var out = [{ key:null, name:D.me.name, cap:'あなた' }];
  (MGROF[key] || []).forEach(function(m){
    if (m.key === D.me.key || m.key === key) return;
    if (!prof(m.key)) return;
    out.push({ key:m.key, name:m.name, cap:m.team + 'のマネージャー' });
  });
  return out;
}

function twinBlock(pr, name){
  var recv = (TALK === 'recv');
  var ch = leftChoices(CUR);
  var cur = ch.filter(function(x){ return x.key === LEFT; })[0] || ch[0];
  var lp = cur.key ? prof(cur.key) : D.me.profile;
  var leftMark = recv ? lp.base : pr.base;   /* 受け取り方は左の人のベースが着地点 */
  var who = cur.key ? esc(cur.name) + 'さん' : 'あなた';
  var note = recv
    ? '線は、相手のベース（' + esc(pr.base) + '）から、' + who + 'のベース（' + esc(lp.base) + '）へ向かっています。'
    : '線は、' + who + 'から、相手のベース（' + esc(pr.base) + '）の階へ向かっています。';

  var sel = '';
  if (ch.length > 1){
    sel = '<div class="seg" style="margin-bottom:12px">' + ch.map(function(x){
      return '<button data-left="' + (x.key || '') + '" class="' + (x.key === cur.key ? 'on' : '') + '">' +
        esc(x.name) + (x.key ? '<span style="font-size:10px;opacity:.75">（' + esc(x.cap) + '）</span>' : '') +
        '</button>';
    }).join('') + '</div>';
  }

  return '<div class="card"><div class="card-b">' + sel +
    '<div class="twin" id="twin"><div class="wire" id="wire"></div>' +
      towerHtml(lp, 'me', cur.cap, cur.name, leftMark) +
      '<div class="gap"></div>' +
      towerHtml(pr, 'you', 'この人', name, pr.base) +
    '</div>' +
    '<p class="flegend" style="margin-bottom:0">●＝1階（ベース）　○＝フェーズ　棒の長さ＝%。' +
      note + '</p>' +
  '</div></div>';
}

/* 相手のベースの階どうしを線で結ぶ */
function drawWire(){
  var twin = $('#twin'), wire = $('#wire');
  if (!twin || !wire) return;
  var a = twin.querySelector('.col.me .tf.on'), z = twin.querySelector('.col.you .tf.on');
  if (!a || !z){ wire.innerHTML = ''; return; }
  var tr = twin.getBoundingClientRect(), ra = a.getBoundingClientRect(), rz = z.getBoundingClientRect();
  var x1 = ra.right - tr.left, y1 = ra.top + ra.height / 2 - tr.top;
  var x2 = rz.left - tr.left,  y2 = rz.top + rz.height / 2 - tr.top;
  var xm = (x1 + x2) / 2, recv = (TALK === 'recv'), head = 8;
  var lw = recv ? (xm - x1 - head) : (xm - x1);          /* 矢じりのぶん短くする */
  var rw = recv ? (x2 - xm) : (x2 - xm - head);
  wire.innerHTML =
    '<i style="left:' + (recv ? x1 + head : x1) + 'px;top:' + (y1 - 1) + 'px;width:' +
      Math.max(lw, 0) + 'px;height:2px"></i>' +
    '<i style="left:' + (xm - 1) + 'px;top:' + Math.min(y1, y2) + 'px;width:2px;height:' +
      Math.abs(y2 - y1) + 'px"></i>' +
    '<i style="left:' + xm + 'px;top:' + (y2 - 1) + 'px;width:' + Math.max(rw, 0) + 'px;height:2px"></i>' +
    (recv
      ? '<u class="l" style="left:' + x1 + 'px;top:' + (y1 - 5) + 'px"></u>'
      : '<u class="r" style="left:' + (x2 - head) + 'px;top:' + (y2 - 5) + 'px"></u>');
}

function paneTalk(pr){
  var chL = leftChoices(CUR);
  var curL = chL.filter(function(x){ return x.key === LEFT; })[0] || chL[0];
  var me = curL.key ? prof(curL.key) : D.me.profile;

  var h = '<div class="seg">' +
    '<button data-talk="send" class="' + (TALK === 'send' ? 'on' : '') + '">伝え方</button>' +
    '<button data-talk="recv" class="' + (TALK === 'recv' ? 'on' : '') + '">受け取り方</button></div>';

  if (TALK === 'send'){
    var t = (M.tsutae || {})[pr.base] || {};
    h += '<div class="card"><div class="card-h">相手のベースに合わせる</div><div class="card-b">' +
      '<p class="sub">' + youLabel + 'の' + floorNo(me, pr.base) + 'F ' + esc(pr.base) +
      '　→　相手の' + floorNo(pr, pr.base) + 'F ' + esc(pr.base) + '</p>' +
      '<div class="kv"><span class="k">チャンネル</span><span class="v">' + esc(t['チャンネル'] || '') + '</span></div>' +
      '<div class="kv"><span class="k">認知の核</span><span class="v">' + esc(t['認知の核'] || '') + '</span></div>' +
      '<div class="kv"><span class="k">ポイント</span><span class="v">' + esc(t['伝え方のポイント'] || '') + '</span></div>' +
      '</div></div>';
    h += '<div class="card"><div class="card-h">言い方の例</div><div class="card-b">';
    ['依頼する','進捗確認する','意見を聞く'].forEach(function(k){
      h += '<div class="step"><span class="hd">' + k + '</span><span class="tx">「' + esc(t[k] || '') + '」</span></div>';
    });
    h += '<p class="tiny" style="margin-top:12px">「何を」は変えず、「どのように」だけを変えています。</p></div></div>';
  } else {
    var u = (M.uke || {})[pr.base + '>' + me.base] || {};
    var same = pr.base === me.base;
    h += '<div class="card"><div class="card-h">' + esc(pr.base) + ' → ' + esc(me.base) +
         (u['認知'] ? '　' + esc(u['認知']) : '') + '</div><div class="card-b">';
    (same ? ['普段は','でも、ズレると…'] : ['相手は','あなたは','こんな受け取り方も','別の受け取り方は'])
      .forEach(function(k){
        if (!u[k]) return;
        h += '<div class="step"><span class="hd">' + esc(k) + '</span><span class="tx">' +
             esc(u[k]).replace(/\n/g, '<br><br>') + '</span></div>';
      });
    h += '<p class="tiny" style="margin-top:12px">受け取り方に「正しい」はありません。ズレて感じること自体は自然なことです。</p></div></div>';
  }
  return h;
}

function paneFuel(pr){

  var h = '<div class="card"><div class="card-h">心理的欲求　フェーズ：' + esc(main) + '</div><div class="card-b">';

function paneOff(pr){

/* ============ 組織図 ============ */
function nodeHtml(p, roleTag){
  var pr = prof(p.key);
  var badge = p.b ? '<span class="bB">B</span>' : '';

        '<span class="bpdot" style="background:' + COLOR[pr.base] + '"></span>' +

/* 段の配列からツリーを組む。facility とプロジェクトで共用 */
function treeHtml(rows){
  var out = '';
  rows.forEach(function(row, i){
    var nodes = row.members.map(function(p){
      var tag = row.staff ? null : ((p.role || '管理者') + (isDup(p.key) ? '・兼任' : ''));
      return nodeHtml(p, tag);
    });
    if (i === 0){
      out += '<div class="mgr-row">' + nodes.join('') + '</div>';
    } else if (row.members.length === 1 && !row.staff){
      out += '<span class="trunk"></span><div class="mgr-row">' + nodes.join('') + '</div>';
    } else {
      out += '<span class="trunk"></span><div class="staff">' +
        nodes.map(function(n){ return '<div class="cell">' + n + '</div>'; }).join('') + '</div>';
    }
  });
  if (rows.length === 1 && rows[0].staff){
    out = '<div class="staff nobar">' +
      rows[0].members.map(function(p){ return '<div class="cell">' + nodeHtml(p, null) + '</div>'; }).join('') +
      '</div>';
  }
  return '<div class="tree">' + out + '</div>';
}

/* その人の上に立つマネージャー（所属する組織の段1の人）。複数所属なら複数 */
var MGROF = {};
function buildMgrOf(){
  D.chart.forEach(function(c){
    var tiers = c.tiers || [];
    if (!tiers.length) return;
    var lead = tiers[0][0];
    if (!lead) return;
    var below = [];
    tiers.slice(1).forEach(function(t){ t.forEach(function(p){ below.push(p); }); });
    (c.members || []).forEach(function(p){ below.push(p); });
    below.forEach(function(p){
      if (p.key === lead.key) return;
      var arr = MGROF[p.key] = MGROF[p.key] || [];
      if (!arr.some(function(x){ return x.key === lead.key; }))
        arr.push({ key:lead.key, name:lead.name, team:c.name });
    });
  });
}

/* 管理職か（いずれかの組織の段に載っている人） */
var ISMGR = {}, MGRLEVEL = {};
function buildMgrFlags(){
  D.chart.forEach(function(c, ci){
    (c.tiers || []).forEach(function(t, ti){
      t.forEach(function(p){
        ISMGR[p.key] = 1;
        /* 上位組織の段をそのまま階層とし、下位組織の長はその下に置く */
        var lv = (ci === 0) ? ti : 90;
        if (MGRLEVEL[p.key] === undefined || lv < MGRLEVEL[p.key]) MGRLEVEL[p.key] = lv;
      });
    });
  });
}

function facilityHtml(c, open){
  var ppl = unitPeople(c), t = tally(ppl);
  var mix = '';
  TYPES.forEach(function(ty){
    if (!t.count[ty]) return;
    mix += '<span class="mixdot" title="' + ty + '"><span class="d" style="background:' +
           COLOR[ty] + '"></span>' + t.count[ty] + '</span>';
  });
  var un = t.total - t.trained;
  if (un) mix += '<span class="mixdot un" title="タイプ未取得 ' + un + '名"><span class="d"></span>未' + un + '</span>';

  /* 役職が「スタッフ」だけの段は、管理職ノードにしない */
  function isStaffRow(tier){
    return tier.every(function(p){
      var r = (p.role || '').trim();
      return r === '' || r === 'スタッフ';
    });
  }
  var rows = (c.tiers || []).map(function(tier){
    return { members:tier, staff:isStaffRow(tier) };
  });
  if ((c.members || []).length) rows.push({ members:c.members, staff:true });

  return '<section class="facility" data-open="' + (open ? '1' : '0') + '">' +
    '<button class="fhead" data-toggle="1">' +
      '<span class="fname">' + esc(c.name) + '</span>' +
      '<span class="fmeta">' + t.total + '名（PCM取得 ' + t.trained + '）</span>' +
      '<span class="fchev">›</span>' +
      '<span class="fmix">' + mix + '</span>' +
    '</button>' +

  '</section>';
}

/* 分布の集計。対象の profile 配列と、末尾に足すブロックを受け取る */
function distPanel(list, extra){
  if (!list.length) return extra ? '<div class="an">' + extra + '</div>' : '';
  var cb = {}, cp = {}, mx = {};
  TYPES.forEach(function(a){ cb[a] = 0; cp[a] = 0; mx[a] = {}; TYPES.forEach(function(b){ mx[a][b] = 0; }); });
  list.forEach(function(pr){ cb[pr.base]++; cp[pr.phase]++; mx[pr.base][pr.phase]++; });
  var max = Math.max.apply(null, TYPES.map(function(t){ return Math.max(cb[t], cp[t]); })) || 1;

  function rows(cnt){
    return TYPES.map(function(t){
      return '<div class="an-row"><span class="an-key" style="color:' + COLOR[t] + '">' + t + '</span>' +
        '<span class="an-track"><span class="an-fill" style="width:' + (cnt[t] / max * 100) +
        '%;background:' + COLOR[t] + '"></span></span>' +
        '<span class="an-num">' + cnt[t] + '</span></div>';
    }).join('');
  }
  var h = '<div class="an">' +
    '<div class="an-block"><h4>ベース分布（PCM取得 ' + list.length + '名）</h4>' + rows(cb) + '</div>' +
    '<div class="an-block"><h4>フェーズ分布</h4>' + rows(cp) + '</div>' +
    '<div class="an-block"><h4>ベース × フェーズ</h4><div class="matrix">' +
      '<span class="mx-corner" title="縦＝ベース／横＝フェーズ">B＼P</span>';
  TYPES.forEach(function(t){
    h += '<span class="mx-head" title="フェーズ ' + t + '"><span class="mx-dot" style="background:' +
         COLOR[t] + '"></span></span>';
  });
  TYPES.forEach(function(b2){
    h += '<span class="mx-head row" title="ベース ' + b2 + '"><span class="mx-dot" style="background:' +
         COLOR[b2] + '"></span></span>';
    TYPES.forEach(function(p2){
      var n = mx[b2][p2];
      h += '<span class="mx-cell' + (b2 === p2 ? ' diag' : '') + '" title="' + b2 + '×' + p2 + '：' + n + '名">' +
        (n || '') + '</span>';
    });
  });
  h += '</div><p class="mx-cap">縦＝ベース、横＝フェーズ。数字は人数。枠は、ベースとフェーズが同じ人。</p></div>';
  return h + (extra || '') + '</div>';
}

function loadRecs(){
  try {
    localStorage.setItem('pcm.probe','1'); localStorage.removeItem('pcm.probe');
    RECS = JSON.parse(localStorage.getItem('pcm.recs') || '[]');
  } catch(e){ STORE_OK = false; RECS = []; }
}
function saveRecs(){ try { localStorage.setItem('pcm.recs', JSON.stringify(RECS)); } catch(e){ STORE_OK = false; } }
function addRec(key, who, tab, body){
  var d = new Date();
  RECS.unshift({ id:'r' + Date.now(),
    d: d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(),
    key:key, who:who, tab:tab, body:body });
  saveRecs();
}
function dumpText(){
  var order = [], byKey = {};
  RECS.forEach(function(r){
    if (!byKey[r.key]){ byKey[r.key] = { name:r.who, tabs:{}, tabOrder:[] }; order.push(r.key); }
    var g = byKey[r.key], tb = r.tab || 'その他';
    if (!g.tabs[tb]){ g.tabs[tb] = []; g.tabOrder.push(tb); }
    g.tabs[tb].push(r);
  });
  var out = [];
  order.forEach(function(k){
    var g = byKey[k];
    out.push('■ ' + g.name);
    g.tabOrder.forEach(function(tb){
      out.push('［' + tb + '］');
      g.tabs[tb].forEach(function(r){ out.push(r.d + '　' + r.body); });
    });
    out.push('');
  });
  return out.join('\n');
}
function logRow(r){

/* 読み込んだ記録を取り込む。この配布版にいない相手の記録は無視する */
function importRecs(text){
  var data;
  try { data = JSON.parse(text); } catch(e){ toast('読み込めないファイルです'); return; }
  var list = data && data.recs;
  if (!Array.isArray(list)){ toast('記録が入っていないファイルです'); return; }

  var have = {};
  RECS.forEach(function(r){ have[r.id] = 1; });
  var add = 0, dup = 0, skip = 0;

  list.forEach(function(r){
    if (!r || !r.id || !r.body){ skip++; return; }
    if (have[r.id]){ dup++; return; }
    var isPj = (String(r.key).indexOf('pj:') === 0);
    if (!isPj && !PEOPLE[r.key]){ skip++; return; }   /* この配布版にいない相手 */
    RECS.push({ id:r.id, d:r.d || '', key:r.key, who:r.who || '', tab:r.tab || '', body:r.body });
    have[r.id] = 1; add++;
  });

  RECS.sort(function(a, b){ return a.id < b.id ? 1 : (a.id > b.id ? -1 : 0); });
  saveRecs();

  /* プロジェクトも引き継ぐ。いなくなったメンバーは外し、全員いなければ取り込まない */
  var pAdd = 0, pDup = 0, pSkip = 0, pTrim = 0;
  if (Array.isArray(data.projects)){
    var cur = loadPJ(), hasId = {};
    cur.forEach(function(x){ hasId[x.id] = 1; });
    data.projects.forEach(function(x){
      if (!x || !x.id || !Array.isArray(x.keys)){ pSkip++; return; }
      if (hasId[x.id]){ pDup++; return; }
      var keys = x.keys.filter(function(k){ return !!PEOPLE[k]; });
      if (!keys.length){ pSkip++; return; }
      if (keys.length < x.keys.length) pTrim++;
      cur.push({ id:x.id, name:x.name || '名称未設定のプロジェクト', keys:keys });
      hasId[x.id] = 1; pAdd++;
    });
    savePJ(cur);
  }

  renderRecs();
  var msg = add + '件を読み込みました';
  var note = [];
  if (dup) note.push('重複 ' + dup + '件');
  if (skip) note.push('対象外 ' + skip + '件');
  if (note.length) msg += '（' + note.join('、') + '）';
  if (pAdd || pDup || pSkip){
    msg += '／プロジェクト ' + pAdd + '件';
    var pn = [];
    if (pTrim) pn.push(pTrim + '件はメンバーを調整');
    if (pDup) pn.push('重複 ' + pDup + '件');
    if (pSkip) pn.push('対象外 ' + pSkip + '件');
    if (pn.length) msg += '（' + pn.join('、') + '）';
  }
  toast(msg);
}

function renderRecs(){
  var h = '';
  if (!STORE_OK) h += '<div class="card"><div class="card-b"><p class="note-wa">この開き方では、記録が端末に残りません。アプリを閉じると消えます。書いたら「書き出す」でコピーして、メモやメールに貼ってください。</p></div></div>';
  if (!RECS.length) h += '<div class="card"><div class="card-b">' +
    '<p class="sub">メンバーやプロジェクトの画面をいちばん下まで開くと、書き残せます。</p>' +
    '<div class="btnrow"><button class="btn sub" data-recload="1">読み込む</button></div>' +
    '<p class="tiny" style="margin-top:9px">前の版で保存したファイルから、記録とプロジェクトを引き継げます。</p></div></div>';

  /* 相手ごと、さらに項目ごとにまとめる。どちらも新しい順 */
  var order = [], byKey = {};
  RECS.forEach(function(r){
    if (!byKey[r.key]){ byKey[r.key] = { name:r.who, tabs:{}, tabOrder:[] }; order.push(r.key); }
    var g = byKey[r.key], tb = r.tab || 'その他';
    if (!g.tabs[tb]){ g.tabs[tb] = []; g.tabOrder.push(tb); }
    g.tabs[tb].push(r);
  });

  order.forEach(function(k){
    var g = byKey[k], n = 0;
    g.tabOrder.forEach(function(tb){ n += g.tabs[tb].length; });
    var isPj = (k.indexOf('pj:') === 0), isMe = (k === D.me.key);
    var canOpen = isPj ? (canView() && loadPJ().some(function(x){ return 'pj:' + x.id === k; }))
                       : (isMe || (PEOPLE[k] && prof(k)));
    var label = isPj
      ? '<button class="who" data-pjgo="' + esc(k.slice(3)) + '">' + esc(g.name) + '</button>'
      : isMe
        ? '<button class="who" data-tab="self">' + esc(g.name) + '</button>'
        : '<button class="who" data-person="' + esc(k) + '">' + esc(g.name) + '</button>';
    h += '<div class="mgrp"><div class="stt">' +
      (canOpen ? label : esc(g.name)) + '　' + n + '件</div>';
    g.tabOrder.forEach(function(tb){
      h += '<div class="card"><div class="card-h">' + esc(tb) + '　' + g.tabs[tb].length + '件</div>' +
        '<div class="card-b">' + g.tabs[tb].map(logRow).join('') + '</div></div>';
    });
    h += '</div>';
  });

  if (RECS.length){
    h += '<div class="btnrow">' +
      '<button class="btn sub" data-recsave="1">ファイルに保存</button>' +
      '<button class="btn sub" data-recload="1">読み込む</button>' +
      '<button class="btn sub" data-recdump="1">' + (DUMP ? '閉じる' : 'テキストで書き出す') + '</button></div>';
    if (DUMP) h += '<div class="card" style="margin-top:10px"><div class="card-b">' +
      '<textarea id="dumpText" readonly style="min-height:150px;font-size:13px">' + esc(dumpText()) + '</textarea>' +
      '<div class="btnrow"><button class="btn sub" data-reccopy="1">コピー</button></div>' +
      '<p class="tiny" style="margin-top:9px">コピーしてメールやメモに貼り付けてください。' +
      '別の版へ引き継ぐときは「ファイルに保存」を使ってください（プロジェクトも一緒に保存されます）。</p></div></div>';
  }
  $('#page-recs').innerHTML = h;
}

/* ============ タブと遷移 ============ */
var TABS = [
  { id:'self',    name:'自分',        g:'●' },
  { id:'list',    name:'メンバー',     g:'▤' },
  { id:'org',     name:'組織図',      g:'▦' },
  { id:'project', name:'プロジェクト', g:'◧' },
  { id:'recs',    name:'記録',        g:'✎' }
];
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(function(t){
    var on = (VIEW === t.id) || (VIEW === 'person' && t.id === 'list');
    var lk = (t.id === 'project') && !canView();
    return '<button data-tab="' + t.id + '" class="' + (on ? 'on' : '') + (lk ? ' lk2' : '') + '">' +
      '<b>' + t.g + '</b>' + t.name + '</button>';
  }).join('');
}
var TITLE = { self:'自分', list:'メンバー', org:'組織図', project:'プロジェクト', recs:'記録' };
function go(v){
  VIEW = v;
  ['self','list','person','org','project','recs'].forEach(function(id){
    $('#page-' + id).hidden = (id !== v);
  });
  $('#back').hidden = (v !== 'person');
  if (v !== 'person') $('#ttl').textContent = TITLE[v] || 'PCM';
  if (v === 'self')    renderSelf();
  if (v === 'list')    renderList();
  if (v === 'person')  renderPerson();
  if (v === 'org')     renderOrg();
  if (v === 'project') renderProject();
  if (v === 'recs')    renderRecs();
  renderTabs();
  window.scrollTo(0, 0);
}

/* ============ 操作 ============ */
document.addEventListener('click', function(e){
  var t;
  if ((t = e.target.closest('[data-toggle]'))){
    var box = t.parentElement;
    box.dataset.open = box.dataset.open === '1' ? '0' : '1';
    return;
  }
  if ((t = e.target.closest('[data-all]'))){
    var op = t.dataset.all === '1';
    [].forEach.call(document.querySelectorAll('#page-org .facility'), function(b){
      b.dataset.open = op ? '1' : '0';
    });
    return;
  }
  if (e.target.closest('#back')){ go('list'); return; }
  if ((t = e.target.closest('[data-tab]'))){ CUR = null; go(t.dataset.tab); return; }
  if ((t = e.target.closest('[data-person]'))){ openPerson(t.dataset.person); return; }
  if ((t = e.target.closest('[data-sub]'))){ SUBTAB = t.dataset.sub; renderPerson(); return; }
  if ((t = e.target.closest('[data-talk]'))){ TALK = t.dataset.talk; renderPerson(); return; }
  if ((t = e.target.closest('[data-left]'))){ LEFT = t.dataset.left || null; renderPerson(); return; }
  if ((t = e.target.closest('[data-seg]'))){ SELFSEG = t.dataset.seg; renderSelf(); return; }

  if (e.target.closest('[data-intro]')){
    $('#introGo').textContent = '閉じる'; $('#ov').hidden = false; return;
  }
  if (e.target.closest('#introGo')){ $('#ov').hidden = true; return; }

  /* 記録 */
  if ((t = e.target.closest('[data-recadd]'))){
    var ta = t.closest('.card').querySelector('.memo');
    var body = ta ? ta.value.trim() : '';
    if (!body){ if (ta) ta.focus(); return; }
    var who = t.dataset.recwho || (PEOPLE[t.dataset.recadd] || {}).name || '';
    addRec(t.dataset.recadd, who, t.dataset.rectab, body);
    ta.value = '';
    if (VIEW === 'person') renderPerson();
    else if (VIEW === 'project') renderProject();
    else if (VIEW === 'self') renderSelf();
    toast('書き残しました'); return;
  }
  if ((t = e.target.closest('[data-recdelok]'))){
    var rid = t.dataset.recdelok;
    RECS = RECS.filter(function(r){ return r.id !== rid; });
    RECDEL = null; saveRecs();
    if (VIEW === 'person') renderPerson();
    else if (VIEW === 'project') renderProject();
    else if (VIEW === 'self') renderSelf();
    else renderRecs();
    toast('削除しました'); return;
  }
  if (e.target.closest('[data-recdelno]')){
    RECDEL = null;
    if (VIEW === 'person') renderPerson();
    else if (VIEW === 'project') renderProject();
    else if (VIEW === 'self') renderSelf();
    else renderRecs();
    return;
  }
  if ((t = e.target.closest('[data-recdel]'))){
    RECDEL = (RECDEL === t.dataset.recdel) ? null : t.dataset.recdel;
    if (VIEW === 'person') renderPerson();
    else if (VIEW === 'project') renderProject();
    else if (VIEW === 'self') renderSelf();
    else renderRecs();
    return;
  }
  if (e.target.closest('[data-recdump]')){ DUMP = !DUMP; renderRecs(); return; }
  if (e.target.closest('[data-recsave]')){ exportRecs(); return; }
  if (e.target.closest('[data-recload]')){ $('#impFile').click(); return; }
  if (e.target.closest('[data-reccopy]')){
    var bx = $('#dumpText'); if (!bx) return;
    bx.select();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(bx.value).then(function(){ toast('コピーしました'); },
        function(){ toast('選択した状態です。手動でコピーしてください'); });
    } else {
      try { document.execCommand('copy'); toast('コピーしました'); }
      catch(err){ toast('選択した状態です。手動でコピーしてください'); }
    }
    return;
  }

  /* プロジェクト */
  if (e.target.closest('[data-pjnew]')){
    PJ = { mode:'edit', id:null, name:'', keys:{}, del:false };
    PJ.keys[D.me.key] = true;
    renderProject(); window.scrollTo(0,0); return;
  }
  if ((t = e.target.closest('[data-pjgo]'))){
    PJ.mode = 'detail'; PJ.id = t.dataset.pjgo; PJ.del = false;
    go('project'); return;
  }
  if ((t = e.target.closest('[data-pjopen]'))){
    PJ.mode = 'detail'; PJ.id = t.dataset.pjopen; PJ.del = false;
    renderProject(); window.scrollTo(0,0); return;
  }
  if ((t = e.target.closest('[data-pjtoggle]'))){
    var kk = t.dataset.pjtoggle, on2 = !PJ.keys[kk];
    PJ.keys[kk] = on2;
    t.setAttribute('aria-pressed', on2);
    t.querySelector('.bx').textContent = on2 ? '✓' : '';
    var n2 = 0; for (var q in PJ.keys){ if (PJ.keys[q]) n2++; }
    var sv = document.querySelector('[data-pjsave]');
    if (sv){ sv.textContent = '保存する（' + n2 + '名）'; sv.disabled = !n2; }
    return;
  }
  if (e.target.closest('[data-pjsave]')){
    var el = $('#pjName'), nm2 = (el && el.value.trim()) || '名称未設定のプロジェクト';
    var keys = Object.keys(PJ.keys).filter(function(x){ return PJ.keys[x]; });
    var list = loadPJ();
    if (PJ.id) list.forEach(function(x){ if (x.id === PJ.id){ x.name = nm2; x.keys = keys; } });
    else { PJ.id = 'p' + Date.now(); list.push({ id:PJ.id, name:nm2, keys:keys }); }
    if (!savePJ(list)) toast('この開き方では保存できません');
    PJ.mode = 'detail'; PJ.del = false; renderProject(); window.scrollTo(0,0); return;
  }
  if (e.target.closest('[data-pjedit]')){
    var c2 = loadPJ().filter(function(x){ return x.id === PJ.id; })[0];
    PJ.mode = 'edit'; PJ.name = c2 ? c2.name : ''; PJ.keys = {};
    (c2 ? c2.keys : []).forEach(function(k){ PJ.keys[k] = true; });
    renderProject(); window.scrollTo(0,0); return;
  }
  if (e.target.closest('[data-pjcancel]') || e.target.closest('[data-pjback]')){
    PJ.mode = 'list'; PJ.del = false; renderProject(); window.scrollTo(0,0); return;
  }
  if (e.target.closest('[data-pjdelok]')){
    savePJ(loadPJ().filter(function(x){ return x.id !== PJ.id; }));
    PJ.mode = 'list'; PJ.id = null; PJ.del = false; renderProject(); toast('削除しました'); return;
  }
  if (e.target.closest('[data-pjdelno]')){ PJ.del = false; renderProject(); return; }
  if (e.target.closest('[data-pjdel]')){ PJ.del = !PJ.del; renderProject(); return; }
  if (e.target.closest('[data-pjcopy]')){
    var txt = pjText();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('書き出しました'); },
        function(){ toast('コピーできませんでした'); });
    } else toast('コピーできませんでした');
    return;
  }
});

$('#impFile').addEventListener('change', function(){
  var f = this.files && this.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){ importRecs(String(fr.result)); };
  fr.onerror = function(){ toast('ファイルを読めませんでした'); };
  fr.readAsText(f, 'utf-8');
  this.value = '';
});

/* ============ ホーム画面に追加できるようにする ============ */
function setupManifest(){
  try {
    var icon = document.querySelector('link[rel="apple-touch-icon"]').getAttribute('href');
    var mf = {
      name: 'PCM ' + D.me.name, short_name: 'PCM',
      start_url: location.href, scope: './',
      display: 'standalone', background_color: '#EEF1F4', theme_color: '#33455E',
      icons: [{ src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' }]
    };
    var url = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type:'application/manifest+json' }));
    var l = document.createElement('link');
    l.rel = 'manifest'; l.href = url;
    document.head.appendChild(l);
  } catch(e){}
}

/* サーバーに置いたときだけ、オフライン用の仕組みを登録する */
function setupOffline(){
  if (location.protocol !== 'https:' || !navigator.serviceWorker) return;
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

/* ============ 有効期限 ============ */
function expiryInfo(){
  var built = D.built, days = D.expireDays || 60;
  var forced = /[?&]expired=1/.test(location.search);
  if (!built) return { expired: forced, left: null, days: days };
  var b = new Date(built + 'T00:00:00');
  if (isNaN(b.getTime())) return { expired: forced, left: null, days: days };
  var end = new Date(b.getTime() + days * 86400000);
  var left = Math.ceil((end - new Date()) / 86400000);
  return { expired: forced || left < 0, left: left, days: days, end: end, built: b };
}
function ymd(d){ return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(); }

function showExpired(info){
  $('#tabs').hidden = true;
  ['self','list','person','org','project','recs'].forEach(function(id){ $('#page-' + id).hidden = true; });
  var when = info.end ? ymd(info.end) : '';
  $('#ovin').innerHTML =
    '<h2>更新してください</h2>' +
    '<p class="s">このファイルの利用期間が終わりました' + (when ? '（' + when + '）' : '') + '。</p>' +
    '<p>新しい版を受け取って、開き直してください。' +
    '組織やプロファイルの変更を反映するため、定期的に配り直しています。</p>' +
    '<p>いま入っている記録とプロジェクトは、下のボタンでファイルに保存できます。' +
    '新しい版の「記録」タブで読み込めば、そのまま引き継げます。</p>' +
    '<p style="margin-top:18px"><button class="btn" data-recsave="1">記録をファイルに保存</button></p>';
  $('#ov').hidden = false;
}

/* ============ 起動 ============ */
$('#who').textContent = D.me.name + '　' + (D.me.title || '');
buildMgrTeams();
buildMgrFlags();
buildMgrOf();
buildPeople();
loadRecs();

setupManifest();
setupOffline();

var EXP = expiryInfo();
if (EXP.expired){ showExpired(EXP); return; }

(function(){
  var h = '<h2>このアプリで大切にしていること</h2>';
  (M.intro.lines || []).forEach(function(l){
    h += '<p' + (l.strong ? ' class="s"' : '') + '>' + esc(l.text) + '</p>';
  });
  $('#ovin').innerHTML = h + '<p style="margin-top:18px"><button class="btn" id="introGo"></button></p>';
})();

var seen = false;
try { seen = localStorage.getItem('pcm.introSeen') === '1'; } catch(e){}
$('#introGo').textContent = seen ? '閉じる' : M.intro.button;
go('self');

if (!seen){
  $('#ov').hidden = false;
  try { localStorage.setItem('pcm.introSeen','1'); } catch(e){}
} else if ((M.micro || []).length){
  var pool = [];
  try { pool = JSON.parse(localStorage.getItem('pcm.microPool') || '[]'); } catch(e){}
  if (!pool.length){
    pool = M.micro.map(function(_, i){ return i; });
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1)), tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
  }
  var idx = pool.shift();
  try { localStorage.setItem('pcm.microPool', JSON.stringify(pool)); } catch(e){}
  var mel = document.createElement('p');
  mel.className = 'micro'; mel.textContent = M.micro[idx];
  $('#page-self').insertBefore(mel, $('#page-self').firstChild);
}
})();
</script>
